xitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
