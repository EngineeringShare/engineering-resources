in:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}

'use strict';const slides=[{"number":1,"title":"Capacitors #1","text":"Capacitors #1","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Capacitors","text":"Capacitors A  capacitor  is an electronic component that stores and releases electrical energy.  Capacitors are commonly used in electronic circuits for functions such as: Storing energy  (like a small battery). Smoothing voltage fluctuations  in power supplies. Filtering signals  in audio and radio systems. Blocking direct current (DC)  while allowing alternating current (AC) to pass.","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"What is a capacitor made from?","text":"What is a capacitor made from? A capacitor is built from 2 plates made from conductive material These two plates store and create an electric field In between the conductive plates there is dielectric material, this material acts as an insulator between the plates This insulator gives a higher capacitance value","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Types of capacitors","text":"Types of capacitors There are two ways of constructing a capacitor: Multilayer Capacitors (MLCs) feature multiple layers of dielectric and metal Single-layer Capacitors feature a single layer of dielectric between two metal sheets","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Dielectric Materials","text":"Dielectric Materials The dielectric dictates the capacitor’s values as well as how it functions A dielectric must have insulating properties; however, it can be many different materials These include: Mica Plastic Paper Ceramic","background":"assets/slide-05.webp","animations":[{"src":"assets/ppt_media_image6.gif","x":59.24794127296588,"y":53.38674540682415,"w":35.15625,"h":28.61111111111111,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":6,"title":"Dielectric Materials - Mica","text":"Dielectric Materials - Mica Made from thin sheets of mica – a naturally occurring mineral These sheets are stacked and layered.  Mica's stability ensures a consistent and durable dielectric. High stability, low loss and high precision are all characteristics of Mica","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Dielectric Materials - Plastic","text":"Dielectric Materials - Plastic Made from thin sheets of plastic film, including: Polypropylene (PP) Polyester (PET) Polytetrafluoroethylene (PTFE)  Polycarbonate (PC) These sheets have the metal deposited on them forming the capacitor Plastic can be easily formed and rolled/stacked making production easier High stability, low loss and a wide range of capacitance are all characteristics of Plastics","background":"assets/slide-07.webp","animations":[{"src":"assets/ppt_media_image6.gif","x":68.23956692913386,"y":14.756211723534559,"w":30.78536745406824,"h":28.61111111111111,"crop":{"l":0,"t":0,"r":0.12433,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":8,"title":"Dielectric Materials - Paper","text":"Dielectric Materials - Paper Made from thin sheets of paper in between metal foil These sheets are often impregnated with oil, wax, or resin to enhance its insulating properties and protect it Paper is relatively cheap and easy to create compared to other dielectrics making it one of the first dielectrics used A low capacitance/voltage rating, moisture sensitivity and dielectric loss are characteristics of paper","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Dielectric Materials - Ceramic","text":"Dielectric Materials - Ceramic Made from thin layers of ceramic including: Barium Titanate and Titanium Dioxide These sheets are layered between metal sheets A high range of capacitance, good temperature regulation and the ability to handle high frequency are characteristics of ceramic Ceramic capacitors frequently are used as single layer capacitors","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Anode and Cathode","text":"Anode and Cathode There are two main terminals on a capacitor, the anode and the cathode The anode stores positive charge The cathode completes the circuit and stores negative charge In most capacitors the anode and cathode are determined by how its plugged in However electrolytic capacitors have a set anode and cathode","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Equations for capacitance of single capacitor","text":"Equations for capacitance of single capacitor C apacitance  of a parallel plate capacitor: Capacitance  of a parallel plate capacitor with  dielectric: Permittivity of free space =  8.85 × 10 −12  Dielectric Constant  ","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Other types of capacitors - Variable","text":"Other types of capacitors - Variable A variable capacitor can change its capacitance using mechanical movement It typically has air as a dielectric as it easily allows movement It's built out of two parts, the rotor and the stator. The stator plates remain stationary and the rotor parts turn. These rotors and stationary plates play the role of the electrode plates","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Other types of capacitors - Electrolytic","text":"Other types of capacitors - Electrolytic An electrolytic capacitor works like most other capacitors with a metal anode and cathode and a dielectric However, it also has electrolytic solution which is referred to as the “actual cathode”. The electrolytic solution acts as the cathode, it just can’t easily transfer out the current The metal cathode just collects the electric current from the electrolyte to complete the circuit The dielectric is a thin oxide layer on the metal formed by air oxidising the material","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Other types of capacitors - Electrolytic","text":"Other types of capacitors - Electrolytic Electrolytic capacitors have etched anodes and cathodes; this increases the surface area which the electrolyte can contact This higher surface area makes a more efficient capacitor as the electrolyte can get into every nook and cranny They can only go in one direction as the oxide layer relies on the chemistry of the capacitor, if the electricity goes the opposite way it destroys the layer and shorts the capacitor","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Capacitance","text":"Capacitance Capacitance  is the ability of a capacitor to store electrical charge. It is measured in  farads  (F), typically expressed in smaller units, such as microfarads (µF) or millifarads (mF).","background":"assets/slide-15.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
