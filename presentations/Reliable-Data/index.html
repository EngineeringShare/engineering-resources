<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reliable Data | Engineering Share</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Reliable Data</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Reliable Data","text":"Reliable Data","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Key Terms","text":"Key Terms Reliability Confidence that results are repeatable and consistent under the same conditions. Combines accuracy and precision. Validity Whether the test measures what it is supposed to measure. Example: Using a voltmeter to measure resistance is not valid.","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Accuracy vs Precision","text":"Accuracy vs Precision Accuracy How close a measurement is to the true value. Example: A voltmeter reads 5.01 V when the actual value is 5.00 V → accurate. Precision How close repeated measurements are to each other. Example: Three readings of 4.85 V, 4.86 V, 4.85 V → precise. Key Difference Accuracy = correctness Precision = consistency Reliable data needs both.","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"What is error?","text":"What is error? Measurement error is the difference between a measured value and the true or accepted reference value of a quantity. No measurement is perfect, and some degree of error is always possible, regardless of the equipment or method used. We can calculate error using:  ","background":"assets/slide-04.webp","animations":[{"src":"assets/ppt_media_image3.gif","x":55.511811023622045,"y":36.88890347039953,"w":36.796875,"h":37.77777777777778,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"}]},{"number":5,"title":"What is error?","text":"What is error? Measurement errors can be divided into two main types, depending on how they affect the results of an experiment: Random Error Systematic Error Unpredictable variations between measurements. A consistent or predictable deviation from the true value. Primarily reduces  precision . Primarily reduces  accuracy . Measurements may be higher or lower than the true value. Measurements may be consistently too high or too low. Its effect can be reduced by repeating measurements and calculating a mean. Cannot be eliminated simply by repeating measurements. E.g. electrical noise, vibrations or inconsistent measuring techniques. E.g. incorrect calibration, zero error or consistent parallax error.","background":"assets/slide-05.webp","animations":[{"src":"assets/ppt_media_image3.gif","x":59.16565780839895,"y":2.6780694079906677,"w":36.796875,"h":37.77777777777778,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"}]},{"number":6,"title":"Human Error","text":"Human Error Definition Mistakes made by the experimenter during measurement, observation, or recording. Examples in Engineering Misreading an analogue scale (parallax error). Incorrectly recording values in a logbook or spreadsheet. Using the wrong unit or conversion (e.g. inches instead of millimetres). Inconsistent use of measuring technique between operators.","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Human Error - Parallax","text":"Human Error - Parallax Definition: Parallax is the apparent shift in a reading when the observer’s eye is not directly in line with the measurement scale and pointer. It causes incorrect readings on analogue instruments or scales. Example: Looking at a rule or dial from an angle makes the reading appear higher or lower than the true value. How to Avoid It: Keep your eye directly above the scale mark or pointer. Use instruments with mirror-backed scales (reflection lines up with pointer). For digital tools, parallax is eliminated.","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Human Error","text":"Human Error Impact on Reliability Introduces random variation between repeated measurements. Can reduce both precision and accuracy of results. Reducing Human Error Use digital instruments where possible. Provide clear training and measurement procedures. Double-check readings and data entries. Automate data logging to reduce manual recording.","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Instrument Error","text":"Instrument Error Definition Errors caused by the limitations, faults, or calibration of measuring equipment. Examples in Engineering A micrometre that is not zeroed correctly. A voltmeter drifting due to low battery or calibration issues. A digital sensor with limited resolution (e.g. only reads to 0.1 V). Wear and tear on tools (e.g. dull  calipers , stretched tape measures).","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Instrument Error","text":"Instrument Error Impact on Reliability Can cause systematic errors (all results shifted the same way). May reduce accuracy even if results are precise. Reducing Instrument Error Regular calibration against standards. Use the appropriate instrument for the measurement range. Maintain equipment properly. Cross-check with a second instrument where possible.","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Environmental Error","text":"Environmental Error Definition Errors caused by external conditions in the testing or measurement environment. Examples in Engineering Temperature changes causing metal expansion/contraction during measurement. Vibrations affecting sensitive instruments (e.g. strain gauges, balances). Humidity or dust interfering with electronic sensors. Air currents disturbing scales or delicate setups.","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Environmental Error","text":"Environmental Error Impact on Reliability Can introduce random variations or systematic shifts. Makes repeated measurements less consistent. Reducing Environmental Error Carry out tests in controlled conditions (labs, insulated enclosures). Allow instruments to stabilise before use. Use shielding or damping to reduce vibration and interference. Record environmental conditions alongside data for context.","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Bias","text":"Bias Definition When results are skewed by preference, expectation, or selective reporting, rather than true measurement. Examples in Engineering Choosing only data that supports a design or hypothesis. Rounding results to “fit” expected values. Operator unconsciously influencing results (e.g. applying extra force to match a target reading). Ignoring outliers without valid justification.","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Bias","text":"Bias Impact on Reliability Creates systematic distortion of results. Makes data appear more reliable than it actually is. Undermines trust in engineering decisions. Reducing Bias Use blind testing where possible. Apply consistent procedures and standards. Ensure independent verification of results. Report all data, including anomalies.","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Improving Reliability of Data","text":"Improving Reliability of Data Repeat Measurements Take multiple readings and calculate an average. Calibration Regularly check and adjust instruments against known standards. Control Variables Keep conditions consistent (temperature, operator, method). Appropriate Equipment Use the right tool for the level of accuracy needed. Independent Verification Have results checked or repeated by others. Automated Recording Use digital logging to reduce manual errors.","background":"assets/slide-15.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
