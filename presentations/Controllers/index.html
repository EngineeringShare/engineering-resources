'use strict';const slides=[{"number":1,"title":"Controllers","text":"Controllers","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Analogue vs Digital Signals Reminder","text":"Analogue vs Digital Signals Reminder For this lesson we are focusing on electrical signals which are split into two forms: Analogue signals are continuous and change smoothly over time Digital signals are discrete and therefore have set values which they change between","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"PWM Reminder","text":"PWM Reminder A technique to control power by rapidly switching a signal between ON and OFF states. Simulates an analogue output using a digital signal Used for controlling motors, LEDs, and power regulation","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"What are controllers?","text":"What are controllers? Controllers are objects that link to sensors and actuators They facilitate communication between sensors and actuators They allow us to perform calculations with sensor inputs ","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"What are microcontrollers?","text":"What are microcontrollers? Microcontrollers are small computers that act as controllers They differ from most regular computers as they are optimised for a specific task They often have lots of I/O (input/output) ports for communicating with lots of sensors and actuators","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Components of a microcontroller","text":"Components of a microcontroller Micro controllers are made of the following key components: Central Processing Unit (CPU): The brain of the microcontroller Processes instructions and controls everything Memory: ROM (Read-Only Memory): Stores the program/code permanently. RAM (Random Access Memory): Temporary memory for running tasks. I/O Pins: Connects to the actuators and sensors","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Most Common Microcontrollers","text":"Most Common Microcontrollers ATmega328P (Arduino Uno) – the most used microcontroller by both hobbyists and industry ESP32 – much more powerful than the ATmega328P includes built in Wi-Fi and Bluetooth capabilities STM32 – Used a lot for industrial and high-performance applications","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Picking a microcontroller","text":"Picking a microcontroller Microcontroller (price) Clock Speed Memory Bit Size GPIO Pins Wifi /Bluetooth built-in Power Usage Use cases Usability ATmega328P (£22-£25) 16MHz 32KB Flash 2KB RAM 8-bit 23 No Low Power (15 mA) Low power or battery powered Easiest ESP32 (£7-£9) Up to 240MHz 4MB Flash 520KB RAM 32-bit 34+ Yes Higher Power (160 mA) Anything that needs wireless Moderate STM32 (£30-£35) Up to 72MHz 64-512KB Flash 20KB RAM 32-bit 37+ No Middle Power (30-100mA) Industrial control Difficult","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"MicroComputers","text":"MicroComputers Microcomputers are miniaturised computers that are used for specific tasks They have a full OS allowing us to do much more complex tasks Most common are Raspberry Pi Series,  BeagleBone  Series and Jetson Nano They have higher power requirements than microcontrollers","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Picking a ","text":"Picking a  MicroComputer Microcontroller Price Power Consumption Processing Power GPIO Pins Best for Raspberry pi 4/5 £50-£100 Most Power Hungry Medium Power 40 Pins General purpose, all rounder BeagleBone  Black £50-70 Least Power Hungry Least Powerful 69 Pins Industrial Control, Automation, Robotics Jetson Nano £80-£120 Medium Power Hungry Most Powerful 40 Pins AI, Machine Learning, Computer Vision","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Microcontroller vs Microcomputers","text":"Microcontroller vs Microcomputers We need a microcomputer when we are doing anything which needs significant processing power For instance, if we wanted to detect an animal on a video feed, we would need a microcomputer as microcontrollers are not powerful enough","background":"assets/slide-11.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
