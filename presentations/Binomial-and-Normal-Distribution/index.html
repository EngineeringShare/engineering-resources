'use strict';const slides=[{"number":1,"title":"Binomial and Normal Distribution","text":"Binomial and Normal Distribution","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Factorials","text":"Factorials A factorial is a symbol to simplify equations n! is equal to the product of the integers from 1 to n For example, 4! =   = 24 5! =   = 120  ","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Factorials","text":"Factorials The best way to think about factorials is the ways of arranging objects. If we have 3 playing cards, then there are 6 different ways we can lay those cards out, this is equal to 3! Which is 6 This is why 0! is 1 because there is only 1 way to arrange no cards.","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Binomial & Normal Distribution","text":"Binomial & Normal Distribution Binomial and normal distributions are both just methods used to model real-world randomness and uncertainty in a mathematically useful way. They are helpful in making predictions, understanding variability and decision making. Binomial Normal","background":"assets/slide-04.webp","animations":[{"src":"assets/ppt_media_image6.gif","x":71.92612368766405,"y":58.3421697287839,"w":26.55602034120735,"h":33.13333333333333,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":5,"title":"Binomial Distribution","text":"Binomial Distribution A binomial distribution is a  discrete  probability distribution This means the values are countable and separate Models the probability of something happening in a set amount of trials Example: flipping a coin 10 times and counting how many times heads appears","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Binomial Distribution Formula","text":"Binomial Distribution Formula Follows the rule: Where:  is the amount of successes  is the number of trials  is the probability of success in a single trial  =   ","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Probability of success (p)","text":"Probability of success (p) We can work out the probability of success in an individual test using the equation: Example: if we flip a coin 10 times and it lands on heads 6 times the probability for heads is 6/10 = 0.6  ","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Example of solving a binomial question","text":"Example of solving a binomial question A power company manufactures  circuit breakers,  each breaker has a  5% probability  of being faulty. If a technician tests 10 randomly selected breakers, what is the probability that exactly 2 of them are faulty?","background":"assets/slide-08.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":75.375,"y":42.35803441236512,"w":15.625,"h":27.77777777777778,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":9,"title":"Example of solving a binomial question","text":"Example of solving a binomial question Identify the given values: Total trials:  n = 10 Probability of success:  p = 0.05 Desired successes:  k  = 2","background":"assets/slide-09.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":75.375,"y":42.35803441236512,"w":15.625,"h":27.77777777777778,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":10,"title":"Normal Distribution","text":"Normal Distribution A normal distribution is a continuous (Gaussian) probability distribution This means the values can be anything within a range Takes the form of a symmetrical bell-shaped curve defined by mean and standard deviation Example: exam scores will follow a normal distribution allowing universities to set grading curves","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Z-score Equation","text":"Z-score Equation The first formula to do with normal distribution is the z-score equation which is: Where: X = the data point  = the mean  = the standard deviation Used when trying to find the probability of something happening in a normal distribution Uses the z-table to find the probability  ","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Reading a z-table","text":"Reading a z-table Z-tables look complicated but they're easy All you do is append the column to the row example, for example for z=-2.51 we would go to the tenth row (-2.5) then the second column (.01)","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Positive vs Negative Z-table","text":"Positive vs Negative Z-table Use the positive Z-table when: Your Z-score is greater than 0 You are finding probabilities to the left of a positive Z-score Use the negative Z-table when: Your Z-score is less than 0 You are finding probabilities to the left of a negative Z-score","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Using Symmetry in Z-Score ","text":"Using Symmetry in Z-Score  Calculations The standard normal distribution is symmetric around Z = 0 This means: We use symmetry when: A Z-table only gives left-tail values (i.e., P(Z\u003cx)) We need the right-tail area, P(Z>x) This saves needing a separate negative Z-table  ","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Probability Density Formula","text":"Probability Density Formula The second equation to do with Normal distribution is the probability density function: Where:  is the value we are trying to find ( e.g  a height of 175cm)  is the mean average around which all data is  centered  (the peak of the bell curve)  is the standard deviation (how far apart the data is) Used when determining how dense probability is at a single point, for calculation the relative likelihood of different values The density will not give us a probability, it will tell us how likely  the value  is in that region  ","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Example of solving a normal distribution (z-score)","text":"Example of solving a normal distribution (z-score) A component has a mean voltage output of 12v ( ) They are built with a specification standard deviation of 0.5v ( ) A component will have to be thrown out if it has an output voltage  below 11v , what is the probability that a randomly chosen power supply will trigger the alarm?  ","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Example of solving a normal distribution (z-score)","text":"Example of solving a normal distribution (z-score) Step 1 is to define the problem: Step 2 is to put the values into the z-score equation  ","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"Example of solving a normal distribution (z-score)","text":"Example of solving a normal distribution (z-score) Step 3 is to find the probability from the z-table Z = -2.00 Therefore probability = 0.0228","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"Example of solving a normal distribution (Probability Density Function)","text":"Example of solving a normal distribution (Probability Density Function) Suppose the heights of students in a class are normally distributed with: Mean = 170cm Standard Deviation = 5cm What is the probability density of a student having a height of 172cm","background":"assets/slide-19.webp","animations":[]},{"number":20,"title":"Example of solving a normal distribution (Probability Density Function)","text":"Example of solving a normal distribution (Probability Density Function) Step 1: Write out the formula Step 2: Plug in values  ","background":"assets/slide-20.webp","animations":[]},{"number":21,"title":"Example of solving a normal distribution (Probability Density Function)","text":"Example of solving a normal distribution (Probability Density Function) Step 3: Simplify the equation Step 4: Calculate components Step 5: Interpret the results The probability density at 172cm is 0.0735. This means that the relative likelihood of a student being exactly 172cm tall is 0.0735, bear in mind this is not the true probability, just an idea of how likely the height is in that ballpark  ","background":"assets/slide-21.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
