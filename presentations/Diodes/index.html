*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Diodes</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Diodes","text":"Diodes","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Atomic Structure","text":"Atomic Structure In a single atom, electrons occupy shells (discrete energy levels). In solids, these levels overlap and form continuous energy bands. The valence band holds bound electrons. The conduction band holds electrons free to move. The band gap is the energy needed to jump from the valence to conduction band.","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Band Gap","text":"Band Gap A band gap is the energy gap (energy required) for an electron to swap from being attached to an atom to jump to a conduction band, where it can move freely and participate in electrical conduction. If electrons can easily jump the gap, then it is likely a metal If electrons can't jump the gap easily then it is an insulator And if the gap is medium but jumpable with some extra power then it is a semiconductor","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Band Gap","text":"Band Gap We measure band gap in electron volts ( ) Typical values of band gaps are: Silicon (Si):  1.12 eV Germanium (Ge):  0.66 eV Gallium Arsenide (GaAs):  1.43 eV Increasing the temperature of a material reduces the band gap making it easier for the electrons to bridge the gap  ","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"What are semiconductor materials","text":"What are semiconductor materials Semi conductor is a term used for a material that has a resistivity somewhere between a conductor and an insulator This means it can play the role of both Typically, we can control its resistivity using an external source such as heat or external voltage This ability to control them makes them essential for everyday electronics","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Typical semiconductor materials","text":"Typical semiconductor materials Typically, devices will use either  silicon (Si) or germanium (Ge) Both silicon and germanium are most common due to their low ‘band gap’  A low band gap means less power is required to swap it to and from conductive and non conductive states They are also used as they are very abundant and found everywhere meaning they are cheap","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Atomic makeup","text":"Atomic makeup Atoms are made up of bands of electrons The outermost band is loosely attached to the atom  They freely detach and reattach to different atoms This is how electricity flows in a wire We can refer to the atoms the electron has jumped to as a “hole”","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Doping","text":"Doping The process of doping involves adding impurities to a semiconductor materials This mostly involves adding  impurity atoms  (dopants) such as boron or phosphorus to the semiconductor. This gives the semiconductor electrical properties and improves conductivity Pure semiconductors have low conductivity The addition of the impurities adds more electrons and holes making a better electric component","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"P vs N","text":"P vs N P-Type (Positive-Type) Doping  adds more holes to the material (more atoms with free electron spots).  N-Type (Negative-Type) Doping  adds more electrons to the material.","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Forming a PN junction","text":"Forming a PN junction When we make a PN junction we stick two materials together, a P doped semiconductor and an N doped semiconductor At the junction, free electrons from the N-side recombine with holes from the P-side, creating a region depleted of charge carriers (the depletion region). In the depleted region there are no free charge carriers meaning this region acts like an insulator Applying a forward bias reduces the depletion width, allowing current to flow across the junction","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Junction Diode","text":"Junction Diode A junction diode is just a basic PN junction This means its one way and blocks flow in the opposite direction In forward bias it allows current to flow normally In reverse bias it blocks current flow until a breakdown voltage is reached at which point current flows, but it permanently damages the diode + -","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Why Junction diodes break in reverse","text":"Why Junction diodes break in reverse When breakdown occurs: The current increases extremely rapidly (essentially limited only by the circuit’s resistance). This produces localised heating within the depletion region. The junction temperature rises, causing thermal runaway:  higher temperature → higher current → more heat → junction failure. The silicon lattice or metal contacts can literally melt or fuse, permanently shorting the junction.","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Zener Diode","text":"Zener Diode A Zener diode is just a PN junction which is specially doped to make it able to work in reverse Current can usually only flow one way unless a breakdown voltage is applied to in reverse In forward bias it allows current to flow normally In reverse bias it blocks current flow until a breakdown voltage is reached at which point current flows without damaging the diode Zener diodes are designed to operate safely in reverse breakdown without being damaged, maintaining a nearly constant voltage. + -","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Reverse vs Forwards Bias","text":"Reverse vs Forwards Bias The bias of a diode depends on how it’s connected in the circuit. If the diode is forward biased, it’s connected in the direction of current flow, allowing current to pass once the forward voltage is reached. If the diode is reverse biased, it’s connected opposite to current flow, so it blocks current (except for a tiny leakage current). Forwards Reverse + + - - Forwards Reverse + + - -","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Voltage Regulator","text":"Voltage Regulator We can use a Zener diode in reverse as a voltage regulator This clamps the voltage to a certain value and stops it rapidly increasing Often used as protection to ensure circuits continue to function properly","background":"assets/slide-15.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
