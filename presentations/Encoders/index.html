*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Encoders</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Encoders","text":"Encoders","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Sensors and actuators","text":"Sensors and actuators Sensors are how a system would measure the environment around it Actuators are how a system interacts with the environment around it But what if we want to measure the actuators a system is using?","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"What is an encoder?","text":"What is an encoder? An encoder is something which is attached to an actuator to measure an aspect of that actuator They can be either linear or rotational which link to the two types of actuators It is used to measure one of these 4 variables: Position Direction Speed Counts","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"What is an encoder","text":"What is an encoder Encoders take motion and convert it to an electrical signal which a controller can understand The controller will convert electrical signal to a useful value that can be used in a program","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Types of encoders","text":"Types of encoders There are 4 main encoder technologies: Magnetic Mechanical Resistive Optical There are 2 main types of encoders: Absolute Incremental","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Incremental vs Absolute Encoders","text":"Incremental vs Absolute Encoders Feature Incremental Encoder Absolute Encoder Output Signal Pulses Unique position code Position Tracking Relative Absolute Power Loss Behaviour Position lost Position retained Resolution Pulses per revolution Unique positions per revolution Cost Lower Higher Applications Speed and relative motion sensing Precise position tracking","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Optical Encoders","text":"Optical Encoders Optical encoders are the most common type of encoder technology They work by shining a beam of light at a light detector. Between the light detector and light source is a disk that spins with many holes in it","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Optical Encoders","text":"Optical Encoders As the disk rotates the light gets let through in pulses based on the pattern on the disk This light pattern is then converted to an electrical signal and sent to the controller The number of holes on the disk determines what the encoder is used for","background":"assets/slide-08.webp","animations":[{"src":"assets/ppt_media_image10.gif","x":55.51338582677165,"y":26.913589967920675,"w":33.23660597112861,"h":62.82700495771362,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":9,"title":"Optical Encoders","text":"Optical Encoders The number of holes in the disk can also be known as the resolution of the encoder, it determines how many distinct positional steps the encoder can detect within one full revolution of the disk. So a disk with 100 holes will have 100 individual steps it measures in a full turn allowing you to be a lot more accurate when controlling a motor","background":"assets/slide-09.webp","animations":[{"src":"assets/ppt_media_image10.gif","x":55.51338582677165,"y":26.913589967920675,"w":33.23660597112861,"h":62.82700495771362,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":10,"title":"Optical Encoders","text":"Optical Encoders Incremental optical encoders have 1 light source and sensor with one ring of holes to determine movement of the system Absolute optical encoders have arrays of light sources and sensors which read out a binary code based on which is on or off","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Optical Encoders","text":"Optical Encoders","background":"assets/slide-11.webp","animations":[{"src":"assets/ppt_media_image12.gif","x":15.29464402887139,"y":27.301181102362204,"w":69.91071194225722,"h":63.031160688247304,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":12,"title":"Advantages/Disadvantages of Optical Encoders","text":"Advantages/Disadvantages of Optical Encoders Advantages Disadvantages High precision and resolution Expensive to make Low wear, long lifespan Sensitive to dust and dirt Works at high speeds Fragile to shock/handling Can detect position and direction Poor performance in extreme temps Less noise than analogue Bulkier than other types Supports incremental & absolute data Needs constant power","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Resistive Encoder","text":"Resistive Encoder A resistive encoder works by varying resistance based on the location of the shaft A resistive controller has a set range, it can't turn infinitely, this range is typically less than 1 full rotation (usually 270 o  or less) Resistive encoders also come in linear format which works on the same principles but with a head moving up and down rather than a shaft rotating","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Resistive Encoder","text":"Resistive Encoder Inside a resistive encoder a wiper contacts a resistive track (typically carbon), as the actuator moves it moves this wiper along the track increasing and decreasing resistance As the resistance increases and decreases so does voltage due to ohm’s law This voltage can then be read by a controller to determine where the encoder is on the track + - Output","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Resistive Encoder","text":"Resistive Encoder Resistive encoders are always absolute as they correspond to a location along the track + - Output","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Advantages/Disadvantages of Resistive Encoders","text":"Advantages/Disadvantages of Resistive Encoders Advantages Disadvantages Cheap Parts wear out over time Easy to use Limited range Continuous analogue output Low precision Good for fixed ranges (e.g., volume) Noisy due to analogue output","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Mechanical Encoder","text":"Mechanical Encoder Mechanical encoders work very similarly to resistive encoders with brushes running over a moving disk When the brushes contact a pad on the encoder, they give an output which can be read by a controller This is because the pads are half of a circuit and when the brushes hit the pad it completes the circuit giving an output","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"Mechanical Encoder","text":"Mechanical Encoder Mechanical encoders can give you direction by checking which of the two brushes contacts the pad first. Whichever one does is the direction the disk is moving Mechanical encoders also come in linear format using the same ideas but in a line. The pads either provide a digital pulse (incremental) which can be read by the microcontroller or a unique binary pattern (absolute)","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"Advantages/Disadvantages of Mechanical Encoders","text":"Advantages/Disadvantages of Mechanical Encoders Advantages Disadvantages Cheap Wears out over time Simple to use Low resolution No complex electronics Not good for high speed Works in dirty environments Contact noise/bouncing Robust Contacts can corrode","background":"assets/slide-19.webp","animations":[]},{"number":20,"title":"Magnetic Encoder","text":"Magnetic Encoder A magnetic encoder uses a magnet or series of magnets attached to an actuator A sensor (such as Hall-effect or magneto resistive sensors) detect changes in the magnetic field due to the moving magnet(s) The sensors measure the strength and orientation of the magnetic field and generate an output signal.","background":"assets/slide-20.webp","animations":[]},{"number":21,"title":"Magnetic Encoder","text":"Magnetic Encoder An incremental magnetic encoder generates pulses based on the movement of the magnet which is then interpreted by the controller An absolute magnetic encoder generates a unique code for every rotation/position based on a magnetic field map","background":"assets/slide-21.webp","animations":[]},{"number":22,"title":"Advantages/Disadvantages of Magnetic Encoders","text":"Advantages/Disadvantages of Magnetic Encoders Advantages Disadvantages Resistant to dirt, dust, and harsh conditions Lower resolution than optical Works in extreme temperatures Affected by magnetic interference Very small/compact Can have slight inaccuracies No physical contact → long life Cheaper than high-res optical High-speed operation","background":"assets/slide-22.webp","animations":[]},{"number":23,"title":"Calculating Position","text":"Calculating Position You don’t have to do anything to find the position of the absolute as it is already a position value To find the position distance/rotation of an incremental encoder you use the equation: So, say we have moved 40 increments from the start position, we have a complete rotation of 360 o  as its rotational and a resolution of 100 we can work out the position as:  so we have moved 144 o  in the clockwise direction  ","background":"assets/slide-23.webp","animations":[]},{"number":24,"title":"Calculating Velocity/Speed","text":"Calculating Velocity/Speed For both incremental and absolute encoders finding the velocity is simple: Velocity =  (change in time is seconds, change in position is either degrees or meters) So, say for an angular incremental encoder we want to find the velocity and we take 2 readings, at 0 seconds it’s at 10 o  and at 6 seconds it's at 90 o We can do (90-10)/(6-0) which is 80/6 which is 13.33  °/s  ","background":"assets/slide-24.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
