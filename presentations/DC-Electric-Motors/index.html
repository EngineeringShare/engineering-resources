in:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ DC Electric Motors</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"DC Electric Motors","text":"DC Electric Motors","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Refresher on ","text":"Refresher on  the Motor  E ffect When we have a wire with current in a magnetic field the force magnetic field generated by the wire interacts with the existing magnetic force making the wire move The magnitude of the force is measured in newtons The equation for the magnitude is  Where: B = Magnetic flux density  I = Current through wire L = Length of wire  = angle between wire and flux The units are (NA-1m-1)  ","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"What is a DC motor","text":"What is a DC motor A DC motor converts electrical energy into rotational mechanical energy They rely on the Electromagnetic Effects that we looked at They are essential for everyday life","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"The principle behind DC electric motors","text":"The principle behind DC electric motors We know that in magnets like poles repel and opposite poles attract due to magnetic fields If we attached a magnet which is allowed to freely rotate onto a shaft, we could use another magnet to manipulate it By quickly flipping the magnets we get continuous motion","background":"assets/slide-04.webp","animations":[{"src":"assets/ppt_media_image5.gif","x":51.891740485564306,"y":40.516506270049575,"w":44.983259514435694,"h":30.435870516185478,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":5,"title":"The principle behind DC electric motors","text":"The principle behind DC electric motors Manually swapping the polarity of the nonrotating magnet would be impractical So instead, we use an electromagnet as the rotating magnet and swap its polarity This electromagnet is often just a loop of wire called an armature The stationary magnet on the outside becomes a “stator” and the spinning magnet becomes a “rotor”","background":"assets/slide-05.webp","animations":[{"src":"assets/ppt_media_image6.gif","x":52.02009514435696,"y":41.7578302712161,"w":42.89531660104987,"h":28.97817147856518,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 5"}]},{"number":6,"title":"The principle behind DC electric motors","text":"The principle behind DC electric motors With one magnet this effect is quite weak So we add another magnet (stator) to increase the strength of the magnetic field Thes magnets are often replaced with curved wide magnets that have a larger surface area and thus a wider magnetic field As magnetic field is directly proportional to Force (from motor effect equation) this increases the torque and thus speed of the motor","background":"assets/slide-06.webp","animations":[{"src":"assets/ppt_media_image7.gif","x":50.25,"y":41.59909594634004,"w":47.206176181102364,"h":29.295640128317295,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":7,"title":"The principle behind DC electric motors","text":"The principle behind DC electric motors Manually swapping the wires on the electromagnet is again impractical So we use the existing rotational force to swap polarity for us To do this we use a commutator and brushes As the shaft spins so does the commutator making them connect with the brushes (one + and one -) which then forms a loop","background":"assets/slide-07.webp","animations":[{"src":"assets/ppt_media_image8.gif","x":51.274852362204726,"y":40.94434237386993,"w":40.225147637795274,"h":33.722338874307376,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 5"}]},{"number":8,"title":"The principle behind DC electric motors","text":"The principle behind DC electric motors One armature loop means we end up with irregular speed and the motor can get stuck To prevent this, we add more armatures that take turns being the electromagnet making the motor move smoothly","background":"assets/slide-08.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":50.5,"y":33.09300087489064,"w":41,"h":46.307844852726745,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 6"}]},{"number":9,"title":"The principle behind DC electric motors","text":"The principle behind DC electric motors There are several ways we can increase the torque(speed) of our motor The first way to increases torque is to increase the number of armatures The second method is adding more windings to each armature as it increases the strength of the electromagnet The third method is increasing the current through the armatures as force (torque) is directly proportional to current Finally, we can add more powerful magnets as stators which will increase the field strength","background":"assets/slide-09.webp","animations":[{"src":"assets/ppt_media_image10.gif","x":52.635564304461944,"y":32.06997666958297,"w":42.073064304461944,"h":47.519830854476524,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":10,"title":"Permanent Magnet vs Electromagnetic Stators","text":"Permanent Magnet vs Electromagnetic Stators The motor we have talked about until now has a permanent magnet acting as the stator, we  call this “PMDC” However, some motors use sets of electromagnets in their stators, these can either be shunt or series wound. This allows for speed to be more easily controlled  This also allows for more torque as an electromagnet will provide a stronger field than a permanent magnet","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Shunt vs Series Motor","text":"Shunt vs Series Motor There are two main ways we can connect an electromagnetic stator in a motor Either shunt(parallel) or series ","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Shunt DC Motor","text":"Shunt DC Motor Connection: The field winding is connected in parallel (shunt) with the armature. Current: Field winding gets constant voltage, so field current is steady. Speed: Fairly constant speed regardless of load. Torque: Lower starting torque. Use cases: Ideal for applications needing steady speed like lathes, fans, and conveyors.","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Series DC Motor","text":"Series DC Motor Connection: The field winding is connected in series with the armature. Current: Same current flows through field and armature, so field strength varies with load. Speed: Varies a lot with load — can become dangerously high at no load (no field). Torque: Very high starting torque. Use cases: Perfect for high-torque needs like cranes, elevators, and electric trains. Saturation point","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Practical","text":"Practical Work in pairs or 3s, follow the worksheet filling it in as you go BE SAFE! Don’t put your hand in anything spinning Don’t mess around with the magnets as they are strong, prone to chipping and will pinch fingers Follow the instructions Don’t short the wires Ask me before you turn anything on","background":"assets/slide-14.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
