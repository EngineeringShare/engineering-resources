<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Methods | Engineering Share</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Control Methods</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Control Methods","text":"Control Methods","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Refresher","text":"Refresher Error:  The difference between the desired value (setpoint) and the actual measured value of a system. Open-loop control:  A control system that operates without feedback, so it does not correct its output if conditions change. Closed-loop control:  A control system that uses feedback to continuously compare output to the setpoint and adjust its response to reduce error. Steady-state error:  The remaining difference between the setpoint and the system output after the system has settled and is no longer changing.","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Bang-Bang Control (On–Off Control)","text":"Bang-Bang Control (On–Off Control) Bang-bang control is a  very simple  control method where the output is either fully on or fully off with no  intermediate levels The controller switches state depending on whether the measured value is  above or below the setpoint This often causes  oscillation around the setpoint  as seen on the graph Bang-bang control is  cheap ,  robust , and  easy to implement , but not very precise. Common applications include  thermostats ,  basic heaters ,  refrigerators , and  float switches .","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"What is a PID Control","text":"What is a PID Control PID control is a  closed loop  feedback mechanism commonly used in automation and robotics The system continuously adjusts the output to optimise the system, respond to changes and minimise error Calculates an output based on the present, past, and predicted future error.","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"What does PID stand for?","text":"What does PID stand for? Proportional – Looking at the present Integral – Looking at the past Derivative – Looking at the future","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Proportional Control (P)","text":"Proportional Control (P) Proportional control means that we adjust the output depending on how large our current error is The bigger our error is, the bigger our correction is Increasing  proportional gain makes the system  respond faster. Too much proportional gain can cause  oscillation  or  instability . Proportional control alone often leaves a  steady-state error . It is simple, fast, and commonly used as the base of PID control systems.","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Proportional Control (P) Equation","text":"Proportional Control (P) Equation Proportional Output Proportional Value (gain) Error Value (setpoint - current)","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Integral Control (I)","text":"Integral Control (I) Integral control responds to the accumulated error over time, not just the current error. It increases the output while error persists, until the error is removed. Integral control is used to  eliminate steady-state error  left by proportional control. Too much integral action can cause  overshoot  and  slow system response. It can also lead to  integral wind-up  if the system cannot respond quickly enough. Integral control improves accuracy but must be carefully tuned.","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Integral Control (I) Equation","text":"Integral Control (I) Equation Integral Output Integral Value Change in time Error Value (setpoint - current)","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Derivative Control (D)","text":"Derivative Control (D) Derivative control responds to the  rate of change of the error  rather than the error itself. It predicts future system behaviour by observing how quickly the error is changing. Derivative action helps  reduce overshoot and oscillation . It improves system  stability and damping. Derivative control is  sensitive to noise  in sensor signals. It is rarely used on its own and is typically combined with P and I in PID control.","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Derivative Control (D) Equation","text":"Derivative Control (D) Equation Derivative Output Derivative Value Change in time Change in Error Value (setpoint - current)","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"PID Equation","text":"PID Equation System output Proportional Equation Integral Equation Derivative Equation","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"PID Response Graph","text":"PID Response Graph","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Tuning PID","text":"Tuning PID PID tuning  is the process of  adjusting the P, I, and D  gains to achieve stable and accurate control. The aim is to  minimise steady-state error ,  overshoot , and  settling time . Increasing  P  makes the system  respond faster  but can cause  oscillation . Increasing  I  removes  steady-state error  but can increase  overshoot  and  slow response . Increasing  D  reduces  overshoot  and improves  stability  but can amplify noise. Tuning is usually done by  trial and error , starting with P, then adding I, then D. Poor tuning can result in  oscillation ,  slow response , or  instability .","background":"assets/slide-14.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
