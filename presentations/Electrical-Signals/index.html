*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Electrical Signals</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Electrical Signals","text":"Electrical Signals","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Control Systems","text":"Control Systems A control system is a system that manages, commands, or regulates the behaviour of another system to achieve a desired output. It does this by: Receiving input signals Processing those signals Producing an output that controls a device or process","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Control Systems","text":"Control Systems A typical control system consists of: Input  - The desired value or command (e.g. button press, set temperature) Controller  - Processes the input and decides what action to take(e.g. PLC, microcontroller, relay logic) Output / Actuator  - Carries out the action(e.g. motor, solenoid valve, hydraulic or pneumatic cylinder)","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"What are signals","text":"What are signals A signal is a measurable quantity used to  communicate information  within a system. (between components) Signals do not usually do work themselves — they tell another part of the system what to do. Examples of signals: Voltage level from a sensor ON/OFF state of a switch Pressure signal in a pneumatic control line PWM signal controlling motor speed","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"What is power transmission","text":"What is power transmission Power transmission is the transfer of energy to perform work. It is responsible for: Movement Force Examples of power transmission: Electrical power driving a motor Hydraulic pressure moving a ram Pneumatic air pressure extending a cylinder Mechanical shafts and gears transferring torque Heat Mechanical output","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Analogue vs Digital signals","text":"Analogue vs Digital signals Signals (particularly electrical) can be categorised into two categories: Analogue signals are continuous and change smoothly over time (for instance 2.5v to 3.4v) Digital signals are discrete and therefore have set values which they change between (for instance on or off)","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Example of an analogue signal","text":"Example of an analogue signal Light Sensor (e.g., LDR) Produces a voltage that varies continuously based on light intensity. It does this by varying resistance based on the light hitting the LDR which relates directly to voltage This voltage then can be read by a microcontroller","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Example of a digital signal","text":"Example of a digital signal Push Button or Switch Outputs either HIGH (1) or LOW (0) depending on whether the switch is pressed. It does this by completing the circuit when the button is pressed A microcontroller can detect when a voltage is input and when it isn’t","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Microcontrollers and Analogue Signals","text":"Microcontrollers and Analogue Signals Most controllers only understand digital logic as they use binary logic So, when putting an analogue signal into a controller you must change it into a digital signal This is done using an ADC or Analogue to Digital Converter","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Analogue to Digital Converter","text":"Analogue to Digital Converter An ADC converts and analogue signal to digital by having “steps” Each of these steps are equal to a certain range of values in an analogue signal The wave is then sampled where points are taken from it and rounded to these steps","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Analogue to Digital Converter","text":"Analogue to Digital Converter So an ADC follows this process: Sampling : The ADC measures the analogue  signal at  regular intervals. Quantization : The sampled values are rounded to the nearest digital level. Encoding : The values are stored as binary numbers (e.g., 8-bit, 10-bit, etc.).","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"ADC Resolution","text":"ADC Resolution The resolution of ADC is the number of steps a wave will be converted to For an 8-bit ADC a wave is split into 256 separate values ( ) For a 10-bit ADC a wave is split into 1024 separate values ( ) Higher resolution means the ADC is more accurate, but the controller needs more processing power  ","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"What is PWM","text":"What is PWM A technique to control power by rapidly switching a signal between ON and OFF states. Simulates an analogue output using a digital signal Used for controlling motors, LEDs, and power regulation","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Parts of a PWM","text":"Parts of a PWM The duty cycle determines what percentage of the wave is “on” This can be worked out by: Duty Cycle (%) = (Time HIGH / Total Period) × 100 100% Duty Cycle → Always ON (Full Power) 50% Duty Cycle → ON half the time (Half Power) 0% Duty Cycle → Always OFF (No Power)","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"PWM Frequency","text":"PWM Frequency How fast the signal switches ON and OFF (measured in Hz). Higher frequency = smoother control (important in motors & audio signals). Lower frequency = flickering or choppy motion in certain applications.","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"PWM Applications","text":"PWM Applications LED Dimming  – Adjust brightness without changing voltage. Motor Speed Control  – DC motors respond to different duty cycles. Servo Motors  – PWM signals determine precise angular positions. Audio Signals & Power Supplies  – Used in digital sound processing and voltage regulation. Communication Systems  – Used in encoding signals for wireless communication.","background":"assets/slide-16.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
