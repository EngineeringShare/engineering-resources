*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Chemical Behaviours</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Chemical Behaviours","text":"Chemical Behaviours","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Atomic Structure (Refresher)","text":"Atomic Structure (Refresher) All materials are made from atoms. An atom contains: Protons (positive charge) Neutrons (no charge) Electrons (negative charge) The arrangement of electrons determines how a substance behaves chemically. An ion forms when an atom gains or loses electrons. Loss of electrons → Positive ion (cation) Gain of electrons → Negative ion (anion) Ions are essential in: Electrolytes Batteries Corrosion reactions","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Types of Bonding (Refresher)","text":"Types of Bonding (Refresher) Ionic Bonding  - Electron transfer between atoms Forms positive and negative ions Strong electrostatic attraction Example: Sodium chloride (NaCl)  Covalent Bonding  - Atoms share electrons Often form gases or low melting point substances Example: Water (H₂O) Metallic Bonding  - Positive metal ions in a “sea” of delocalised electrons Allows electrical and thermal conductivity Gives metals ductility and malleability","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"What is Chemical Behaviour","text":"What is Chemical Behaviour Chemical behaviour describes how a substance reacts, changes, or interacts with other substances due to its atomic structure and bonding. It explains: Whether a material will react How fast it reacts What products are formed How much energy is absorbed or released","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"What is a chemical reaction?","text":"What is a chemical reaction? A Chemical Reaction is a process that occurs when two or more molecules interact to form a new product(s). Compounds that interact to produce new compounds are called reactants whereas the newly formed compounds are called products. Chemical reactions play an integral role in different industries, customs and even in our daily life. They are continuously happening in our general surroundings; for example, rusting of iron, pottery, fermentation of wine and so on. A reaction can take place between two atoms or ions or molecules, and they form a new bond and no atom is destroyed or created but a new product is formed from reactants.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Physical vs Chemical Change","text":"Physical vs Chemical Change Physical Change Chemical Change No new substance formed New substance formed Often reversible Usually irreversible Change in state only Change in composition Examples: Melting ice → physical Rusting steel → chemical","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Indicators of a Chemical Reaction","text":"Indicators of a Chemical Reaction A chemical change is often identified by: Colour change Gas formation (bubbles) Temperature change Light emission Formation of a precipitate","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Types of Chemical Reactions","text":"Types of Chemical Reactions Combustion Reaction A combustion reaction is a reaction with a combustible material with an oxidizer to give an oxidized product. An oxidizer is a chemical a fuel requires to burn, generally oxygen. For example the methane reaction on this slide in which methane reacts with oxygen to produce carbon dioxide, water and heat.  + Heat + Heat","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Types of Chemical Reactions","text":"Types of Chemical Reactions Decomposition Reaction A decomposition reaction is a reaction in which a single component breaks down into multiple products. Certain changes in energy in the environment must be made like heat, light or electricity breaking bonds of the compound. For example calcium carbonate when heated breaks down into calcium oxide and carbon dioxide. Heat   Heat      ","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Types of Chemical Reactions","text":"Types of Chemical Reactions Neutralisation Reaction A Neutralisation reaction is basically the reaction between an acid and a base giving salt and water as the products. The water molecule formed is by the combination of OH– ions and H+ ions. The overall pH of the products when a strong acid and a strong base undergo a neutralization reaction will be 7. For example the hydrochloric acid and sodium hydroxide reaction on this slide result in a neutralization reaction producing Sodium Chloride(Common Salt) and water as the products.","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Types of Chemical Reactions","text":"Types of Chemical Reactions Redox Reaction A redox reaction is a reaction between two chemicals resulting in the production of ions due to the transfer of electrons between reactants. It is the main link between electrochemical link. For example, when zinc reacts with hydrogen the zinc looses 2 electrons making it positively charged and the hydrogen atoms each gain an electron becoming stable. Oxidation→ Loss of electrons Reduction→ Gain of electrons   - -   - Zinc 2/14 electrons   - 2 Hydrogen 1/2 electrons +     -   - -   - + Zinc 0/14 electrons (Stable) (Oxidation) 2 Hydrogen 2/2 electrons (Stable) (Reduction) Note this diagram only shows valence shells Memory tip: Remember OIL RIG Oxidation Is Loss Reduction Is Gain","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Types of Chemical Reactions","text":"Types of Chemical Reactions Precipitation or Double-Displacement Reaction Precipitation reaction is a type of displacement reaction in which two compounds react and consequently, their anions and cations switch places forming two new products. For example, when chlorine and methane react one of the chlorine atoms swaps with one of the hydrogen atoms","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Types of Chemical Reactions","text":"Types of Chemical Reactions Synthesis Reaction A Synthesis reaction is one of the most basic types of reaction wherein multiple simple compounds combine under certain physical conditions giving out a complex product. The product will always be a compound. For example, when hydrogen and oxygen combine to produce hydrogen dioxide (water)","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"What is a Chemical Cell?","text":"What is a Chemical Cell? Chemical cells are electrochemical components which rely on redox reactions to convert chemical to electrical energy. There are two main types of chemical cells: Galvanic Cell  - Converts chemical energy into electrical energy Electrolytic Cell  - Converts electrical energy to chemical energy","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"What is a Galvanic Cell? ","text":"What is a Galvanic Cell?  The galvanic cell consists of two separate half-cells. Each dedicated to the anode or the cathode Each of these half cells contain an electrolyte solution and a conductor acting as an electrode. It works because: One material loses electrons Another material gains electrons The movement of electrons produces current","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"What is a Galvanic Cell? ","text":"What is a Galvanic Cell?  The salt bridge is typically an inverted U-tube. It is filled with a concentrated solution of an inert electrolyte. It often contains a gel mixed with electrolytes such as KNO₃ or K₂SO₄. Its purpose is to complete the circuit by allowing ions to flow between half-cells. It maintains electrical neutrality in the cell. Negative ions move toward the anode. (-) Positive ions move toward the cathode. (+) This ion movement prevents charge build-up and allows the cell to continue functioning.","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"What is a Galvanic Cell? ","text":"What is a Galvanic Cell?  In a galvanic cell, when two-electrode are dipped in their respective ion There is a tendency for: one of the electrodes (anode (-)) to undergo oxidation (lose electrons) the other electrode (cathode (+)) to undergo reduction (gain electrons)  This tendency of losing of electrons (oxidation) or gaining of electrons (reduction) is called electrode potential.","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"What is a Galvanic Cell? ","text":"What is a Galvanic Cell?  Standard electrode potential is defined as the electrode potential of an electrode relative to a standard hydrogen electrode under standard conditions. The standard conditions taken are as follows: 1 molar concentration of each ion in the solution. A temperature of 298 K. 1 bar pressure. We can then form an electrochemical series which tells us the relative potential of various elements The positive values are oxidising agents, the bottom is the reduction agents","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"What is a Galvanic Cell? ","text":"What is a Galvanic Cell?  We can tell whether a cell is feasible based on the electrode potential We do this by working out the cell potential (cell emf) To do this we use this formula:  E o cell =  E Cathode –  E anode If  E o cell    is positive the reaction is feasible If  E o cell    is negative the reaction is not feasible","background":"assets/slide-19.webp","animations":[]},{"number":20,"title":"What is an Electrolytic Cell","text":"What is an Electrolytic Cell An electrolytic cell converts electrical energy into chemical energy Electrodes are dipped in an electrolytic solution containing cations and anions.  On supplying current, the ions move towards electrodes of opposite polarity, and simultaneous reduction and oxidation take place.","background":"assets/slide-20.webp","animations":[]},{"number":21,"title":"What is an Electrolytic Cell","text":"What is an Electrolytic Cell The electrodes are connected to an external DC power supply. The power supply makes the electrode connected to its positive terminal the anode, and the electrode connected to its negative terminal the cathode. The supply forces electrons to move from the power source into the cathode and pulls electrons away from the anode. This drives a chemical reaction that would not occur naturally. Electrical energy from the battery is converted into chemical potential energy stored in the products.","background":"assets/slide-21.webp","animations":[]},{"number":22,"title":"What is an Electrolytic Cell","text":"What is an Electrolytic Cell For example, in the electrolysis of molten sodium chloride, sodium chloride is melted (above  ) Two electrodes are inserted into the melt, and an electric current is passed through the molten salt. The chemical reaction that takes place at the electrodes is as follows: Sodium-ion migrates to the cathode, where sodium ion gains one electron and reduces to sodium metal. ( ) Chloride ions migrate towards the anode, where it loses one electron and gets oxidised to chlorine gas. ( The overall reaction is the breakdown of sodium chloride into its elements ( )  ","background":"assets/slide-22.webp","animations":[]},{"number":23,"title":"Electrolytic vs Galvanic","text":"Electrolytic vs Galvanic Feature Spontaneous Non-Spontaneous External Power Needed? No Yes Energy Conversion Chemical → Electrical Electrical → Chemical Δ G Negative Positive E°cell Positive Negative Common Name Galvanic / Voltaic Electrolytic A spontaneous reaction releases energy naturally, this happens in a galvanic cell A non-spontaneous reaction requires energy to be put in, this happens in an electrolytic cell","background":"assets/slide-23.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
