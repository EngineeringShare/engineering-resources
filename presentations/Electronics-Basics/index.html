<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electronics Basics | Engineering Share</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Electronics Basics</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Electronics Basics","text":"Electronics Basics","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Atomic Structure","text":"Atomic Structure In a single atom, electrons occupy different energy levels or shells. When atoms join together in a material, these energy levels form energy bands. The valence band contains the outer electrons that are normally bound within the material. The conduction band is a higher-energy band where electrons are free to move through the material. Between them is the band gap. Electrons must gain enough energy to cross this gap before they can move freely and contribute to electrical current.","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Conductors","text":"Conductors In conductors the valence and conduction bands overlap, so there are many free-floating electrons which can move through the material These delocalised electrons form an “electron sea” around the atoms. With no applied voltage, the electrons move randomly, so there is no net current. When a voltage is applied, the electrons gain a small overall drift in one direction, producing an electric current.","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Insulators","text":"Insulators In insulators, electrons are held tightly to their atoms and are not free to move through the material. The valence band is full and separated from the conduction band by a large band gap. Under normal conditions, electrons cannot gain enough energy to reach the conduction band, so very little current can flow. Examples: glass, rubber, plastic, and dry wood. Insulators are used to stop current flow and provide safety in circuits.","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Conventional vs Electron Flow","text":"Conventional vs Electron Flow Electron Flow Actual physical movement of electrons. Electrons drift from negative (–) to positive (+) terminal. Matches what’s really happening in the conductor. Conventional Current Flow Defined historically before electrons were discovered. Current assumed to flow from positive (+) to negative (–). Still used today in circuit diagrams and engineering.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Current\t","text":"Current\t Current is the rate at which electric charge flows through a circuit. Current has the symbol  I  and is measured in amperes (A). 1 ampere = 1 coulomb of charge passing a point each second. Analogy Think of current like the flow rate of water through a pipe. More water passing a point each second = greater flow rate. In a circuit, more charge passing a point each second = greater current.","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Measuring Current","text":"Measuring Current We are going to build a simple resistor circuit  Set the voltage on your power supply to 5 volts Connect the  multimeter  in series and measure the current Record it in the table on the worksheet Large current measuring post Small current measuring post Ground post DC current measuring settings","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Voltage\t","text":"Voltage\t Voltage is the potential difference between two points in a circuit. It tells us how much energy is transferred per unit charge. Voltage has the symbol  V  and is measured in volts (V).  1 volt = 1 joule of energy per coulomb of charge. Analogy Voltage is like the pressure difference pushing water through a pipe. Higher voltage means each coulomb of charge can transfer more energy. Voltage can be provided by batteries, power supplies and generators.","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Measuring Voltage","text":"Measuring Voltage We are going to build a different simple resistor circuit  Set the voltage on your power supply to 5 volts Connect the  multimeter  in parallel to the 180Ω resistor and measure the voltage Record it in the table on the worksheet Voltage measuring post Ground post DC voltage measuring settings","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Resistance\t","text":"Resistance\t Resistance is the opposition to the flow of electric current. Resistance has the symbol  R  and is measured in ohms (Ω). Analogy Resistance is like a restriction in a water pipe. A greater restriction makes it harder for water to flow. Similarly, greater electrical resistance makes it harder for current to flow.","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Measuring Resistance","text":"Measuring Resistance We are going to attach a single resistor to our boards Disconnect our power supplies Connect the  multimeter  in parallel to the resistor and measure the resistance Record it in the table on the worksheet Voltage measuring post Ground post Resistance measuring post","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"V = IR\t","text":"V = IR\t Ohm’s Law describes the relationship between voltage, current and resistance in a circuit. For a resistor, increasing the voltage increases the current, while increasing the resistance decreases the current. The relationship is: Where:  = voltage in volts  = current in amperes  = Resistance in ohms  ","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Charge","text":"Charge Electric charge is a property of particles that causes them to experience electrical forces. There are two types of charge: positive (+) and negative (−). Protons have positive charge and electrons have negative charge. Charge,  Q , is measured in coulombs (C). Electron charge is   (charge = current * time)  ","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Energy","text":"Energy Energy is the ability to do work or cause change. Electrical energy has the symbol  E  and is measured in joules (J). Electrical energy transferred depends on voltage, current and time. It has the formula: Where: V = Voltage (volts) I = Current (amps) t = Time (seconds) Examples: A 60W bulb lit for 1 hour uses 216,000J. Phone battery stores energy in the range of 40,000 to 70,000 J.","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Power","text":"Power Power is the rate at which energy is transferred. It has the symbol  P  and the units Watts (W) 1 watt = 1 joule of energy transferred per second. Electrical power depends on both voltage and current. A device with a higher power rating transfers more energy each second. Examples: Phone charger ≈ 10 to 30 W Kettle ≈ 2000 to 3000 W Light bulb ≈ 5 to 60 W  ","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Electric Force","text":"Electric Force Electric force is the force of attraction or repulsion between charged particles. Opposite charges attract. Like charges repel. The force becomes stronger when: the charges are larger the charges are closer together In a circuit, an electric field exerts a force on electrons and causes them to drift through the conductor. Voltage creates an electric field; the electric field exerts a force on charge.","background":"assets/slide-16.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
