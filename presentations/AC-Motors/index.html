*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ AC Motors</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"AC ","text":"AC  Motors","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"What is an AC motor","text":"What is an AC motor An AC motor takes a sinusoidal AC current and turns it into a mechanical movement AC motors are much more common in heavy industry because they can be attached to mains power as it is distributed in the form of AC This is helpful as it means you don’t have to convert between AC and DC for your motors","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Construction - Stator","text":"Construction - Stator The stator of an AC motor is built up of many thin layers (laminations) of iron which is packed tightly together There are slots that run down the length of the stator core into which coils of insulated wire or strands known as windings are inserted.","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Windings in the stator","text":"Windings in the stator Changing the arrangement of the stator windings can change the number of magnetic poles produced. This causes: Lower Motor Speed  – The more slots for windings, the lower the synchronous speed of the motor. Higher Torque at Lower Speeds  – More poles mean the motor can produce higher torque at lower speeds, making it useful for applications like conveyors and cranes. Increased Cost & Size  – More windings require more copper, increasing manufacturing costs and making the motor physically larger.","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Construction - Rotor","text":"Construction - Rotor The rotor is the rotating part of an AC motor. Located inside the stator and mounted on a shaft. Produces mechanical output (rotation) when magnetic fields interact. Made of laminated iron core to reduce eddy current losses. The rotor is the rotating part located inside the stator. Different AC motor types use different rotor designs.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Rotor Construction – Squirrel Cage Rotor","text":"Rotor Construction – Squirrel Cage Rotor Most common type (used in induction motors) Made of conductive bars (aluminium or copper) short-circuited by end rings → looks like a hamster wheel Simple, rugged, low-cost design No electrical connection to external circuits Used in induction motors","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Rotor Construction – Wound Rotor","text":"Rotor Construction – Wound Rotor Windings placed on rotor core (similar to stator windings) These windings then have a current induced in them Resistance can be varied → controls starting torque and speed More complex and expensive than squirrel cage, requires maintenance Used in induction motors","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Rotor Construction – Permeant Magnet","text":"Rotor Construction – Permeant Magnet The rotor contains permanent magnets mounted onto or built into the rotor core.  The magnets provide fixed north and south magnetic poles.  No electrical connection is required to the rotor.  This makes the rotor relatively simple and reduces maintenance.  Used in synchronous motors","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Rotor Construction – Externally Excited","text":"Rotor Construction – Externally Excited The rotor contains electrical windings wrapped around an iron core.  These windings are supplied with DC current.  The DC supply turns the rotor into an electromagnet.  Power can be supplied through:  slip rings and brushes; brushless excitation system.  This design is more complex than a permanent magnet rotor, but allows the rotor magnetic field strength to be controlled Used in synchronous motors","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Construction – Shaft","text":"Construction – Shaft A steel rod connected to the rotor. Transfers the motor’s rotational motion to the load (e.g., pump, fan, conveyor). Must be strong, rigid, and precisely balanced. Can include a keyway or coupling for attaching pulleys, gears, or direct drives.","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Construction – Bearings","text":"Construction – Bearings Support the rotor and allow smooth, low-friction rotation of the shaft. Keep the rotor aligned in the stator air gap. Types commonly used: Ball bearings – smooth, low friction, general purpose. Roller bearings – for heavy loads. Sleeve bearings – simple, used in small motors. Proper lubrication is critical for reducing wear and noise.","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Construction – Internal Fan","text":"Construction – Internal Fan Mounted on the motor shaft inside the housing. Spins with the rotor, forcing air over the motor windings. Provides cooling, preventing overheating during operation. Ensures longer motor life and efficiency.","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Construction – Motor Housing","text":"Construction – Motor Housing Outer casing of the motor, usually cast iron, aluminium, or steel. Protects internal components from dust, moisture, and mechanical damage. Designed with cooling fins to help dissipate heat. Provides mounting points for fixing the motor to a frame or machine.","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"AC Motor Diagram","text":"AC Motor Diagram Bearing Rotor Stator  Name Plate Fan Fan Housing Housing","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Operation - Stator","text":"Operation - Stator When the windings have power put through them, they form a magnetic field The stator contains and conducts the field while also controlling the electrical field","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Operation – Stator (multi phase)","text":"Operation – Stator (multi phase) In three  phase windings are evenly distributed across the stator in pairs, each pair being 120 degrees from the previous one As the 3 phases fluctuate their respective pairs of windings create their own magnetic fields taking turns","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Operation – Stator (multi phase)","text":"Operation – Stator (multi phase) This creates a rotating magnetic flux around the stator","background":"assets/slide-17.webp","animations":[{"src":"assets/ppt_media_image16.gif","x":35.69643208661417,"y":35.13697871099446,"w":55.80356791338583,"h":42.219889180519104,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 6"}]},{"number":18,"title":"Phase Shift","text":"Phase Shift","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"Operation – Stator (Single Phase)","text":"Operation – Stator (Single Phase) With only one sinusoidal supply, the stator produces a magnetic field that pulses back and forth, not a true rotating field. A basic single-phase induction motor is not inherently self-starting. To create rotation, an auxiliary (starter) winding is added. A capacitor shifts the phase of the current in this winding, making its magnetic field slightly out of step with the main winding. The two fields combine to produce a rotating magnetic field, allowing the rotor to start turning even with only one phase of supply.","background":"assets/slide-19.webp","animations":[{"src":"assets/ppt_media_image19.gif","x":75.69005085301838,"y":8.981131525226013,"w":23.073113517060367,"h":41.01886847477399,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":20,"title":"Synchronous Motor","text":"Synchronous Motor If you put a magnet inside a powered stator the magnetic fields will interact with each other and cause the magnet to spin The magnet in the middle can either be a DC electromagnet or a permanent magnet","background":"assets/slide-20.webp","animations":[]},{"number":21,"title":"Synchronous Motor","text":"Synchronous Motor This magnet will spin at the same speed as the flux does due to the interacting magnetic fields","background":"assets/slide-21.webp","animations":[{"src":"assets/ppt_media_image22.gif","x":51.53572014435696,"y":29.155103528725576,"w":39.46427985564304,"h":58.666666666666664,"crop":{"l":0.25908,"t":0,"r":0.23198,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":22,"title":"Advantages of a Synchronous AC Motor ","text":"Advantages of a Synchronous AC Motor  Constant Speed Operation  – Operates at synchronous speed while it remains in synchronism and within its operating limits. High Efficiency at Full Load  – More efficient than induction motors at full load due to lower rotor losses. Power Factor Correction  – Can operate at a leading power factor (over-excited condition), helping to improve the power factor of the entire system. Stable and Reliable Performance  – No slip, which is beneficial for applications needing precise timing and synchronisation. High Torque at Low Speeds  – Unlike induction motors, synchronous motors can deliver high torque at low speeds, useful in applications like rolling mills and crushers.","background":"assets/slide-22.webp","animations":[]},{"number":23,"title":"Disadvantages of a Synchronous AC Motor ","text":"Disadvantages of a Synchronous AC Motor  Requires External Excitation  – Needs a separate DC source (exciter or permanent magnets) to magnetise the rotor. Not Self-Starting  – Unlike induction motors, it requires an external starting mechanism (e.g., damper windings or a separate induction motor). More Complex and Expensive  – Due to the excitation system and additional control components, it is costlier to manufacture and maintain. Less Efficient at Partial Loads  – Efficiency can drop at lower loads, making them less suitable for varying load applications. More Sensitive to Load Fluctuations  – Sudden load changes can cause instability, and if overloaded, the motor may lose synchronism and stop functioning properly.","background":"assets/slide-23.webp","animations":[]},{"number":24,"title":"Equation for Speed of an AC motor","text":"Equation for Speed of an AC motor Where:  is synchronous speed (RPM)  is supply frequency (Hz) P is the number of poles  ","background":"assets/slide-24.webp","animations":[]},{"number":25,"title":"Asynchronous (Induction) motors","text":"Asynchronous (Induction) motors Induction motors work differently from synchronous motors They rely on the idea of electromagnetic induction This means that the magnetic field from the stator induces an electrical current in the rotor which then generates its own magnetic field which interacts with the stator’s producing rotational movement","background":"assets/slide-25.webp","animations":[{"src":"assets/ppt_media_image24.gif","x":59.73214402887139,"y":29.19970836978711,"w":33.75,"h":59.37172645086031,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":26,"title":"Asynchronous (Induction) motors","text":"Asynchronous (Induction) motors For induction motors to work the rotor must turn slower than the rotation of the flux from the stator The rotor must turn slower as otherwise there would be no induced current in the rotor as the magnetic field interacting with it would not be changing  If the rotor reached synchronous speed, there would be no relative motion between the rotor and rotating magnetic field. No voltage would therefore be induced in the rotor, rotor current would fall to zero, and no torque would be produced. The difference between the flux rotation and rotor rotation is called “ Slip ”","background":"assets/slide-26.webp","animations":[{"src":"assets/ppt_media_image25.gif","x":57.36373851706037,"y":30.723111694371536,"w":34.13626148293963,"h":58.89558180227471,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":27,"title":"Equation for slip (Induction Only)","text":"Equation for slip (Induction Only) Where: S = slip (%)  = synchronous speed (RPM)  = motor speed (RPM) 100% converts from decimal to %  ","background":"assets/slide-27.webp","animations":[]},{"number":28,"title":"Advantages of Induction Motors","text":"Advantages of Induction Motors Simple and Robust Design  – No brushes, commutators, or slip rings (in squirrel cage type), making them highly durable and low-maintenance. Self-Starting  – Three-phase induction motors are inherently self-starting. Cost-Effective  – Relatively cheap to manufacture due to simple construction. Efficient and Reliable  – High efficiency at full load and long operational life. Good Speed Regulation  – While not as precise as synchronous motors, induction motors maintain stable speeds under varying loads. No Need for Separate Excitation  – Rotor current is induced by electromagnetic induction, eliminating the need for an external DC source.","background":"assets/slide-28.webp","animations":[]},{"number":29,"title":"Disadvantages of Induction Motors","text":"Disadvantages of Induction Motors Lower Efficiency at Partial Loads  – Efficiency drops significantly under light loads. Lower Power Factor  – Operates at a lagging power factor, requiring power factor correction in large installations. Speed Variation with Load  – Unlike synchronous motors, speed slightly decreases with increasing load due to slip. High Starting Current  – Draws a large inrush current during startup, requiring additional starting methods (e.g., star-delta starters, autotransformers). Limited Speed Control  – Speed control is less efficient and more complex compared to DC or synchronous motors.","background":"assets/slide-29.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
