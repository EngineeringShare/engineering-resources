*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Chain and Belt Drives</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Chain and Belt Drives","text":"Chain and Belt Drives","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Mechanical power transmission types","text":"Mechanical power transmission types We can split our power transmission based on how it moves: Rotary: circular motion (e.g. motor shaft, gears) Linear: straight-line motion (e.g. piston, actuator) Oscillating: back-and-forth motion (e.g. cam follower, lever) But we can also split them on the properties of the transmitter Flexible drives: belts, chains Rigid drives: gears, cams Special drives: harmonic, cycloidal","background":"assets/slide-02.webp","animations":[{"src":"assets/ppt_media_image4.gif","x":84.93750820209974,"y":54.50084572761738,"w":13.660711942257217,"h":16.902857976086324,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 7"},{"src":"assets/ppt_media_image5.gif","x":72.01563320209974,"y":56.911402741324004,"w":11.86160597112861,"h":21.08729950422864,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 9"},{"src":"assets/ppt_media_image6.gif","x":84.9375,"y":72.71500437445319,"w":10.176386154855644,"h":16.902857976086324,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 11"}]},{"number":3,"title":"Key Concept – Centre Distances","text":"Key Concept – Centre Distances The centre distance is the distance between the centre of two pulleys/gears It affects belt tension, wrap angle, and the overall layout of the drive system. Choosing the correct centre distance is important for maintaining grip, reducing wear, and ensuring smooth power transmission.  ","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Positive Engagement vs Friction Drive","text":"Positive Engagement vs Friction Drive Positive Engagement Drive Positive engagement means two components transmit motion through interlocking geometry (not friction). Behaves well under high torque scenarios Examples include gears, chains and sprockets, or timing belts, where the teeth physically mesh to prevent slip. Friction Drive Friction drives transmit motion by surface contact and grip between components. This means they are prone to slipping in high torque scenarios Examples include flat or V-belt pulley systems, where friction between the belt and pulley transfers power.","background":"assets/slide-04.webp","animations":[{"src":"assets/ppt_media_image4.gif","x":67.97899442257219,"y":26.123461650627004,"w":27.25322342519685,"h":33.72131816856226,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"},{"src":"assets/ppt_media_image8.gif","x":69.91072014435696,"y":60.63492271799358,"w":23.389780183727034,"h":31.186380869058034,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":5,"title":"Direction of Rotation","text":"Direction of Rotation Gears: Gears mesh directly, so they reverse the direction of rotation. If the driver turns clockwise → the driven turns anticlockwise. Each additional gear reverses direction again (odd = reversed, even = same). Belts and Chains: Belts and chains loop around pulleys or sprockets, so the direction stays the same. If the driver turns clockwise → the driven also turns clockwise. The same applies if both rotate anticlockwise.","background":"assets/slide-05.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":67.6602690288714,"y":61.7029163021289,"w":27.946866797900263,"h":21.154228638086906,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"},{"src":"assets/ppt_media_image4.gif","x":71.49638287401575,"y":25.333333333333332,"w":25.074581692913387,"h":31.025605132691748,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":6,"title":"Sprockets","text":"Sprockets Sprockets are like gears, but instead of meshing with another gear, they engage with a chain (or occasionally a toothed belt). They transmit motion through positive engagement - the sprocket’s teeth fit precisely into the chain’s rollers or links, ensuring no slip and maintaining a fixed speed ratio. Sprocket teeth are shaped specifically to match the chain pitch and roller diameter, not the involute profile used in gears.","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Belt Drives","text":"Belt Drives Purpose:   Transfer power between rotating shafts using flexible belts and pulleys. How it works:  Power is transmitted by friction between the belt and pulley. The belt wraps around pulleys to change speed, direction, or torque. Types: Flat Belt V-Belt Timing (synchronous) Belt","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Flat Belts","text":"Flat Belts Description: A flat, flexible strip of rubber, leather, or fabric that wraps around flat pulleys. Power Transmission Method: Relies purely on friction between the belt and pulley. The belt slips slightly under load. Typical Uses: Older machinery, fans, small conveyors, textile or woodworking equipment.","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Flat Belts","text":"Flat Belts Advantages: Simple, inexpensive, and easy to align. Can run at high speeds and over long distances. Quiet operation and low maintenance. Limitations: Can slip under high torque or sudden loads. Requires good tensioning and alignment. Not suitable for precise motion or high-torque transfer.","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"V-Belts","text":"V-Belts Description: A belt with a trapezoidal cross-section that fits into a matching V-shaped pulley groove. Power Transmission Method: Uses wedging action for friction. As tension increases, the belt wedges deeper into the pulley groove, increasing grip. Typical Uses: Automotive alternators and compressors, industrial machines, HVAC blowers, small mechanical drives.","background":"assets/slide-10.webp","animations":[{"src":"assets/ppt_media_image15.gif","x":59.82142388451444,"y":48.670632837561975,"w":22.58928805774278,"h":39.556357538641,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":11,"title":"V-Belts","text":"V-Belts Advantages: Higher torque capacity than flat belts. Less slippage due to wedge effect. Compact and efficient for short-distance drives. Limitations: Generates more heat at high speeds. Not ideal for very long centre distances. Still subject to some slip, so not suitable for precision timing.","background":"assets/slide-11.webp","animations":[{"src":"assets/ppt_media_image15.gif","x":59.82142388451444,"y":48.670632837561975,"w":22.58928805774278,"h":39.556357538641,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":12,"title":"Timing Belts (Toothed Belts or Synchronous Belts)","text":"Timing Belts (Toothed Belts or Synchronous Belts) Description: A rubber or polymer belt with moulded teeth that mesh with matching grooves on the pulley. Power Transmission Method: The teeth on the belt mesh with the sprocket/pulley making sure there is no slip Typical Uses: Robotics, 3D printers, CNC machines, automotive camshafts, timing systems where position accuracy matters.","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Timing Belts (Toothed Belts or Synchronous Belts)","text":"Timing Belts (Toothed Belts or Synchronous Belts) Advantages: Precise synchronization between shafts (constant speed ratio). High efficiency and quiet operation. No lubrication required. Limitations: Limited torque capacity compared to chains or gears. Sensitive to debris or wear that can damage teeth. More expensive than friction belts.","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Chain Drives","text":"Chain Drives Purpose: Transmit power between rotating shafts using a linked chain and sprockets How It Works: Power is transmitted by positive engagement between chain links and sprocket teeth — no slip. The centre distance between sprockets determines chain length and tension. Used where consistent speed ratio and higher torque are required. Key Features: Roller Chain is most common (bushings, rollers, and pins). Chains can connect parallel or offset shafts. Direction and speed depend on sprocket sizes (like gears).","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Chain Drives","text":"Chain Drives Advantages: Maintains accurate speed ratio with no slip. Handles high torque and load. Simple to replace or reconfigure for different ratios. Limitations: Needs proper lubrication and alignment. Chain wear can cause backlash over time. Generates more noise and vibration than belts.","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Length of Belt Calculation","text":"Length of Belt Calculation","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Length of Chain Calculation","text":"Length of Chain Calculation  = number of pitches  = number of teeth on the driving sprocket  = number of teeth on the driven sprocket  = centre distance (m)  = chain pitch (m)  ","background":"assets/slide-17.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
