*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Degrees of Freedom and Range of Motion</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Degrees of Freedom and Range of Motion","text":"Degrees of Freedom and Range of Motion","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Actuators Outputs","text":"Actuators Outputs   Linear Actuators : Produce straight-line motion (e.g., hydraulic pistons, lead screw actuators).  Rotary Actuators : Produce rotational motion (e.g., motors, rotary solenoids).  Combination Actuators : Use mechanisms like cams or gears to combine motions.","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Electric Actuators - Motors","text":"Electric Actuators - Motors Purpose:  Convert electrical energy into mechanical movement (rotation or motion). How they work:  When an electric current flows through a coil inside a magnetic field, it produces a force (the motor effect) that makes the shaft turn. Common Types: DC Motors – simple, rotate when powered; speed changes with voltage. Stepper Motors – rotate in precise steps, useful for positioning. Servo Motors – allow controlled angle or position movement. What happens when voltage increases: More current flows → motor spins faster or with more torque (depending on type). An electric motor Output – Rotary Input – Power  A stepper motor Output – Rotary Input – Power & Control Signal ","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Electric Actuators - Solenoid","text":"Electric Actuators - Solenoid Purpose:  Convert electrical energy into a linear (straight-line) pushing or pulling motion. How they work:  A coil of wire creates a magnetic field when current flows. This magnetic field pulls or pushes a metal rod (plunger) inside the coil. What happens when voltage is applied: Current flows through the coil → magnetic field is created → plunger moves in or out. Types of Solenoids: Pull-type – plunger is pulled into the coil. Push-type – plunger is pushed out when activated. An electric solenoid Output – Linear Input – Power ","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Hydraulic Actuators","text":"Hydraulic Actuators Purpose:  Use pressurised liquid (usually oil) to create linear or rotary movement with high force. How they work:  A pump forces fluid into a cylinder or motor. The fluid pressure pushes against a piston (linear motion) or rotates a shaft (rotary motion). What happens when pressure increases: More fluid pressure → greater force or torque output. Types of Hydraulic Actuators: Hydraulic Cylinder – produces straight-line (linear) movement. Hydraulic Motor – produces rotary motion.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Pneumatic Actuators","text":"Pneumatic Actuators Purpose:  Use compressed air to create linear or rotary motion. How they work:  Air pressure is applied to a piston inside a cylinder (for linear motion) or to a vane/rotor (for rotary motion). The expansion of compressed air pushes the actuator into movement. What happens when air pressure increases: Higher pressure → stronger movement or force output. Types of Pneumatic Actuators: Cylinders – provide straight-line pushing or pulling. Pneumatic motors/rotary actuators – provide rotation.","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Degrees of Freedom (","text":"Degrees of Freedom ( DoF ) Definition :  The number of independent ways a robot or mechanism can move. Each  DoF  = one type of motion (translation or rotation). More  DoF  = more flexibility and complexity.","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"2D Motion","text":"2D Motion To understand  DoF  we will start with 2D motion In 2D motion we have 3 possible motions: Move around increasing or decreasing x and y Rotate on a fixed point","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"2D Motion","text":"2D Motion So, for a robot arm which only exists in 2d space its joints can either: Extend and retract linearly changing x or y Rotate around a fixed-point changing x and y of a different part of the arm","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"2D range of motion","text":"2D range of motion So now we can explain the possible ways the whole arm can move Each joint in our 2D arm has a limited range of movement: A limited extension length for a piston in x and y A limited rotation based on motor limits or collision with other parts of the arm","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"2D Degrees of Freedom","text":"2D Degrees of Freedom So, for this 2D arm we can simplify it drastically into a collection of joints And for each joint which makes up the arm we can take its motion and record it as a degree of freedom Typically, one joint = one  DoF  (but not always; some joints allow more than one type of movement).","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"2D Degrees of Freedom","text":"2D Degrees of Freedom The arm on this slide has 2 joints (  and  ) Each of these joints only has rotational motion So, the arm has 2 joints, each with 1 motion This means the arm has 2  DoF  ","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"3D ","text":"3D  RoM  and  DoF 3D range of motion works the same as 2D, we take each joint or actuator and look at how it moves and how much it can move Often this involves a large bottom actuator which rotates our whole 2D system ","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"End Effector","text":"End Effector The end effector is the final point in our robot arm. It's often the point we’d attach a gripper or an actuator to do a task It’s the part of the arm that does the action","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"2D workspace","text":"2D workspace Our  DoF  and effect the workspace our robot arm can reach This workspace is the area that the end effector can reach Its important to know as it determines how you’d use the robot arm","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"3D workspace","text":"3D workspace We can expand our 2D workspace and rotate it around a point making a continuous shape This shape is the point the end effector of the arm can reach","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Types of end effector - Pneumatic","text":"Types of end effector - Pneumatic Definition: End effectors that use compressed air to grip, move, or release objects. Common types: Suction cups (vacuum grip) Pneumatic grippers (two-jaw or three-jaw) Blowing/air-jet systems","background":"assets/slide-17.webp","animations":[{"src":"assets/ppt_media_image16.gif","x":67.5625,"y":26.913589967920675,"w":23.4375,"h":44.44444444444444,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"}]},{"number":18,"title":"Types of end effector - Pneumatic","text":"Types of end effector - Pneumatic How they work: Powered by a pneumatic system (compressed air supply + valves + cylinders). Air pressure generates motion or suction. Controlled via solenoid valves or PLCs. Can be designed for pick-and-place, packaging, or assembly tasks.","background":"assets/slide-18.webp","animations":[{"src":"assets/ppt_media_image16.gif","x":67.5625,"y":26.913589967920675,"w":23.4375,"h":44.44444444444444,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"}]},{"number":19,"title":"Types of end effector - Pneumatic","text":"Types of end effector - Pneumatic Advantages Lightweight and simple design. Fast operation – quick open/close. Cost-effective compared to hydraulic systems. Safe for delicate items (no sharp edges). Easy to integrate with automation systems.","background":"assets/slide-19.webp","animations":[{"src":"assets/ppt_media_image16.gif","x":67.5625,"y":26.913589967920675,"w":23.4375,"h":44.44444444444444,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"}]},{"number":20,"title":"Types of end effector - Pneumatic","text":"Types of end effector - Pneumatic Disdvantages Limited gripping force – not suitable for very heavy loads. Requires constant air supply and good sealing. Less precise than electric or hydraulic alternatives. Can be noisy (air release)..","background":"assets/slide-20.webp","animations":[{"src":"assets/ppt_media_image16.gif","x":67.5625,"y":26.913589967920675,"w":23.4375,"h":44.44444444444444,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"}]},{"number":21,"title":"Types of end effector - Electric","text":"Types of end effector - Electric Definition: End effectors powered by electric motors, solenoids, or actuators. Provide precise, programmable control over gripping and manipulation. Common types: Servo-driven grippers Solenoid-based tools Electric screwdrivers, welders, or cutters","background":"assets/slide-21.webp","animations":[]},{"number":22,"title":"Types of end effector - Electric","text":"Types of end effector - Electric Use electric motors or actuators to generate motion. Controlled directly by the robot’s controller or PLC. Can provide position feedback using encoders or sensors. Allow fine control of grip force, speed, and position.","background":"assets/slide-22.webp","animations":[]},{"number":23,"title":"Types of end effector - Electric","text":"Types of end effector - Electric Use electric motors or actuators to generate motion. Controlled directly by the robot’s controller or PLC. Can provide position feedback using encoders or sensors. Allow fine control of grip force, speed, and position.","background":"assets/slide-23.webp","animations":[]},{"number":24,"title":"Types of end effector - Electric","text":"Types of end effector - Electric Advantages High precision and repeatability. Adjustable grip strength for different objects. Can handle complex or delicate tasks. Lower maintenance than pneumatic/hydraulic systems. Easy integration with sensors and feedback systems..","background":"assets/slide-24.webp","animations":[]},{"number":25,"title":"Types of end effector - Electric","text":"Types of end effector - Electric Disadvantages More expensive than simple pneumatic grippers. Typically slower than pneumatic systems for very rapid cycles. Less force compared to hydraulic end effectors. Requires electrical wiring and drivers.","background":"assets/slide-25.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
