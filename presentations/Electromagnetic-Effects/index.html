in:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}

'use strict';const slides=[{"number":1,"title":"Electromagnetic Effect","text":"Electromagnetic Effect","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Refresher on magnetic fields","text":"Refresher on magnetic fields Magnetic Fields always follow  these 5 rules (properties): Opposites attract Like Repel Flow North -> South Field lines never cross Field lines never break","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Electromagnetic Effects","text":"Electromagnetic Effects The electromagnetic effect (electromagnetism) is the term that encompasses all interactions between magnets and electronics A wire carrying current will generate a magnetic field, this is an  electromagnet A wire moving through a magnetic field will have a current generated in it, this is  electromagnetic induction","background":"assets/slide-03.webp","animations":[{"src":"assets/ppt_media_image3.gif","x":61.51227854330708,"y":12.07318460192476,"w":28.487721456692913,"h":35.75997375328084,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":4,"title":"The 3 laws","text":"The 3 laws All electromagnetic effects are governed by 3 rules: Faradays law :  The magnitude of the induced emf is directly proportional to the rate of change in magnetic flux. (a greater change in magnetic flux = a greater change in current) Lenz’s law:  The induced emf acts in such a direction to produce effects that oppose the change causing it. (the current acts in the opposite direction to the movement of the magnet) Ampere-Maxwell law: Magnetic fields are created by electric currents and changing electric fields, meaning that both steady and changing electric currents can produce magnetic fields.","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Electromagnetic Induction","text":"Electromagnetic Induction Electromagnetic induction is the effect where a magnetic field generates a current flow in a circuit. There are two main types of electromagnetic induction Statically Induced EMF where the conductor stays still and a  magnetic field  moves through it, these will typically be in a loop setup Motivational Induced EMF where the conductor moves through the magnetic field.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Statically Induced EMF","text":"Statically Induced EMF Statically induced EMF follows faraday’s law as well as Lenz’s law which combine into:  Where:  = induced voltage (emf)  = magnetic flux  = time = number of loops - = Lenz’s component  ","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Motivational Induced EMF","text":"Motivational Induced EMF Motivational Induced EMF also follows faraday’s law having the equation: Where:  = induced voltage (emf)  = Magnetic field  = Length of conductor  = velocity of the conductor  ","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Motivational Induced EMF","text":"Motivational Induced EMF For motivational induced current we know the direction of the current based on the right-hand  rule You line up your fingers with the following: Th umb =  Th rust (velocity/motion) Fi rst finger = Magnetic  Fi eld Second finger = Current","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Other laws around EMF","text":"Other laws around EMF Self-Induced EMF (Back EMF): Occurs when a coil opposes the change in current flowing through it. Mutually Induced EMF: Induced in a secondary coil due to the changing current in a nearby primary coil.","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Self Induced EMF","text":"Self Induced EMF Occurs when the change in current in a coil induces a voltage (EMF) in the same coil Follows the equation Where:  = induced voltage (emf)  = inductance of the coil  = change in current  = change in time - = Lenz’s component  ","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Mutually Induced EMF","text":"Mutually Induced EMF Mutually induced EMF occurs when a changing current in one coil induces a voltage (EMF) in a nearby coil. It has the equation:                Where:  = induced voltage (emf)  = mutual inductance of the two coils  = change in current  = change in time - = Lenz’s component  ","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Electromagnets","text":"Electromagnets We know that current going through a wire makes a magnetic field However, if we make the wire into a loop it interacts with itself forming a different electric field","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Electromagnets","text":"Electromagnets We can combine multiple loops to make a solenoid (electromagnet) The field inside of the solenoid is strong and uniform The field outside the solenoid is like that of a bar magnet","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Electromagnets","text":"Electromagnets We can find out what direction the field is flowing using the right-hand curl rule The thumb will point towards the north pole, or the direction the field flows through the solenoid","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Ampere + Maxwell’s Law","text":"Ampere + Maxwell’s Law The strength of the magnetic field can be worked out using the ampere-maxwell equation: Where:  = the magnetic field   = the infinitesimal vector along the closed loop c  is the enclosed current within the loop  is the rate of change of electric flux through the loop  is the permeability of free space ( )  is the permittivity of free space ( )  ","background":"assets/slide-15.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
