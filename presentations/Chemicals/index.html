<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemicals | Engineering Share</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Chemicals</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Chemicals","text":"Chemicals","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"What is a chemical?","text":"What is a chemical? A chemical is any substance with a defined chemical composition that has specific physical and chemical properties. Chemicals can be: Elements (e.g. copper, hydrogen) Compounds (e.g. water, sodium chloride) Mixtures (e.g. air, alloys, salt solution) A chemical’s structure determines how it behaves: Electrical conductivity Reactivity with other substances Solubility in liquids","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Why chemicals are important","text":"Why chemicals are important Engineering systems rely on chemical behaviour to function correctly Metals, polymers, ceramics, and composites are all chemicals Chemical structure affects: Strength and durability Corrosion resistance Electrical conductivity Batteries and cells rely on chemical reactions to produce electricity Electrolytes must be chemically suitable and soluble Poor chemical selection increases internal resistance and heat","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Types of Chemicals: Compound","text":"Types of Chemicals: Compound A compound is a chemical made from two or more elements  chemically bonded  together in a fixed ratio. Key features Fixed composition New properties different from the original elements Cannot be separated by physical means Engineering examples Water (H₂O) – coolant, cleaning Sodium chloride (NaCl) – electrolytes Silicon dioxide ( SiO ₂) – glass, insulation","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Types of Chemicals: Compound","text":"Types of Chemicals: Compound Chemical Formula: Compounds are represented by their chemical formula.  A chemical formula is a symbolic representation of the proportions of atoms that constitute a particular chemical compound.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Types of Chemicals: Compound","text":"Types of Chemicals: Compound Compounds can be classified into two types,  molecular compounds  and  salts : In molecular compounds, the atom binds each other through  covalent bonds . (when electrons are shared between atoms) In salts, it is held together with  ionic bonds . (when electrons are transferred from one atom to another)","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Why structure matters in engineering","text":"Why structure matters in engineering Bond type affects conductivity (ionic vs covalent) Molecular shape affects solubility Functional groups affect reactivity and corrosion Structure affects internal resistance in electrolytes","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Types of Chemicals: Mixture","text":"Types of Chemicals: Mixture A mixture is a combination of substances not chemically bonded. Key features Variable composition Components retain their properties Can be separated by physical methods Engineering examples Alloys (e.g. steel, brass) Air Oil with additives Salt dissolved in water","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Types of Chemicals: Mixture","text":"Types of Chemicals: Mixture There are two main types of mixtures: Homogeneous  solutions are solutions with  uniform composition  and properties throughout the solution. For example a cup of coffee, perfume, cough syrup, a solution of salt or sugar in water, etc. Heterogeneous  solutions are solutions with  non-uniform composition  and properties throughout the solution. A solution of oil and water, water and chalk powder and solution of water and sand, etc.","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Types of Chemicals: Solution","text":"Types of Chemicals: Solution A solution is a specific type of  Homogeneous  mixture where: A solute is dissolved in a solvent Particles are at the molecular or ionic scale The solute will not separate out Examples Salt dissolved in water Sugar in water Electrolytes in batteries","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Types of Solutions – Saturation ","text":"Types of Solutions – Saturation  A supersaturated solution  comprises a large amount of solute at a temperature wherein it will be reduced, as a result the extra solute will crystallize quickly. An unsaturated solution  is a solution in which a solvent can dissolve more solute at a given temperature. A saturated solution  can be defined as a solution in which a solvent cannot dissolve any more solute at a given temperature.","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Types of Solutions – Aqueous ","text":"Types of Solutions – Aqueous  Aqueous solution  – When a solute is dissolved in water the solution is called an aqueous solution. Eg, salt in water, sugar in water and copper sulphate in water. Non-aqueous solution  – When a solute is dissolved in a solvent other than water, it is called a non-aqueous solution. Eg, iodine in carbon tetrachloride, sulphur in carbon disulfide, phosphorus in ethyl alcohol.","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Types of Solutions – Concentration ","text":"Types of Solutions – Concentration  A dilute solution  contains a small amount of solute in a large amount of solvent. A concentrated solution  contains a large amount of solute dissolved in a small amount of solvent.","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Types of Chemicals: Suspension","text":"Types of Chemicals: Suspension A suspension is a specific type of  Heterogeneous  mixture where: Particles with a diameter greater than 1000 nm such that the particles are visible to naked eyes. The particles of a suspension do not pass through a filter paper. So a suspension can be separated by filtration. The suspension is unstable. The particles of a suspension settle down after some time. Examples Muddy water Sand particles suspended in water Flour in water","background":"assets/slide-14.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
