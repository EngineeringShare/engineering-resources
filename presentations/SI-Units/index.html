'use strict';const slides=[{"number":1,"title":"Units of measurement","text":"Units of measurement","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Imperial vs Metric","text":"Imperial vs Metric Metric Imperial Based on  7 base units Uses a decimal system (*10) making it easier to scale Consistent, logical and used  worldwide Required in engineering and science Uses inches, feet, pounds, gallons No consistent pattern  (12in = 1ft, 3ft = 1 yard, 16 oz = 1lb) Still used in some industries and countries Prone to mistakes when converting","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Système International ","text":"Système International  d’Unités The modern metric system is entirely based around SI units These units were internationally agreed in 1960 at the  General Conference on Weights and Measures (CGPM)  however they had been developed since the 1800s They provide a single standard set of units that all humans can use worldwide They built it around 7 base units Members of the 10 th  CGPM which developed early steps towards CGPM","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Base SI Units","text":"Base SI Units There are 7 “base” units in engineering and science All other units are built from these base units They are the “building blocks” of derived units","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Base SI Units - Time","text":"Base SI Units - Time Time is measured in  seconds These have the units  s The duration of 9,192,631,770 oscillations of radiation from the caesium-133 atom. Used to be based on   of a mean solar day but due to uneven rotation of the earth it was changed to be something more predictable  ","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Base SI Units - Mass","text":"Base SI Units - Mass Mass is measured in  kilograms These have the units  kg Based on the Planck constant “h” which is  The Planck constant (h) is just a really, really tiny number that tells us how much energy is in one “packet” of light (a photon) for each wave of it.  ","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Base SI Units – Amount of Substance","text":"Base SI Units – Amount of Substance Substance is measured in  mole These have the units  mol Contains exactly   entities (Avogadro’s number) As atoms are far too small to logically count scientists measured gas values like volumes, masses and electric charges to determine how many atoms it has and thus how many “moles”  ","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Base SI Units – Luminous Intensity","text":"Base SI Units – Luminous Intensity Luminous Intensity is measured in  candela These have the units  cd Luminous intensity in each direction of a source emitting monochromatic radiation at 540 THz with radiant intensity 1/683 W The definition basically just means the measurement of a single colour green light (540THz) in a single direction at an intensity of 1/683 watts.","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Base SI Units – Thermodynamic Temperature","text":"Base SI Units – Thermodynamic Temperature Thermodynamic Temperature is measured in  kelvin These have the units  K Defined via the Boltzmann constant   J/K The unit size for K and for °C is the same. The only difference is K starts at -273.15°C so T(K)=T(°C)+273.15 We use it as it is always positive which makes equations easier  ","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Base SI Units – Electric Current","text":"Base SI Units – Electric Current Electric Current is measured in  ampere These have the units  A Defined via the elementary charge  The elementary charge (symbol e) is the smallest unit of electric charge that exists in nature.  (1 proton = +e) (1 electron = -e)  ","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Base SI Units – Length","text":"Base SI Units – Length Length is measured in  metres These have the units  m Distance light travels in vacuum in   of a second This value is based on the speed of light as c=299,792,458m/s  ","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Derived SI Units","text":"Derived SI Units A derived unit measures more complex values They are “constructed” out of the base SI Units They can always be written in their “base form”","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Derived SI Units","text":"Derived SI Units A derived unit measures more complex values They are “constructed” out of the base SI Units They can always be written in their “base form” Derived SI units are formed by multiplying and dividing SI base units, including raising them to different powers.","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Derived SI Units - Area","text":"Derived SI Units - Area One of the simplest derived units is  area Area has the symbol  This means it is made from the base units    which is  length * length  ","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Derived SI Units - Volume","text":"Derived SI Units - Volume Using the derived unit for area we can determine the derived unit for  volume Volume has the equation  area * height This means it is made from the base units    which is   which is  length * length * length   Area Height","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Derived SI Units – Volume Conversion","text":"Derived SI Units – Volume Conversion Meters are not the only way we measure volume We also measure volume in litres, to convert between litres and metres we do: Or   Area Height","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Derived SI Units - Force","text":"Derived SI Units - Force Another derived unit is  newtons Force has the symbol  N However, in base units Force is defined as   ","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"Unit multiples and submultiples","text":"Unit multiples and submultiples Engineering and science often deals with  very large or very small numbers SI units use  prefixes  to make numbers easier to read and work with All these prefixes are  powers of 10  which makes them easy to use These prefixes come from across Europe including Latin, Greek and modern made-up words","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"All prefixes","text":"All prefixes","background":"assets/slide-19.webp","animations":[]},{"number":20,"title":"Why Imperial Units were used","text":"Why Imperial Units were used Imperial units are still used for many day-to-day things for instance: This is for a few reasons: Imperial is easier to convert or at least estimate, with most of them using base 12, which is easier to divide Lots of people (mainly working class) were unwilling to convert from their local system when metric was introduced Food Clothing Travel Construction","background":"assets/slide-20.webp","animations":[]},{"number":21,"title":"Imperial units - Length","text":"Imperial units - Length In imperial measurements length is measured in inches, feet, yards and miles 12 inches (“) = 1 foot (‘) 3 feet (‘) = 1 yard (yd) 1760 yards (yd) = 1 mile (mi) 1 mile = 1760 yards = 5280 feet = 63360 inches 1 foot = 0.3048 metres","background":"assets/slide-21.webp","animations":[]},{"number":22,"title":"Imperial units – Mass","text":"Imperial units – Mass Ounces are awkward as it can mean two different values, either mass or volume depending on what you’re talking about We use the mass version when weighing something 16 ounces (oz) = 1 pound (lb) 1 ounce   28.35 grams  ","background":"assets/slide-22.webp","animations":[]},{"number":23,"title":"Imperial units – Volume","text":"Imperial units – Volume Ounces are awkward as it can mean two different values, either mass or volume depending on what you’re talking about For liquids we use fluid ounces 20 fluid ounces ( fl  oz) = 1 pint (pt) 8 pints (pt) = 1 gallon (gal) 1 fluid ounce   28.41 millilitres   Note this is the UK conversion, America does it different","background":"assets/slide-23.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
