in:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Cams and Gears</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Gears and Cams","text":"Gears and Cams","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Mechanical Power Transmission","text":"Mechanical Power Transmission What it means: Mechanical power transmission is how energy and motion are transferred between parts in a system. It allows movement from motors or actuators to be used to drive mechanisms. Main motion types: Rotary: circular motion (e.g. motor shaft, gears) Linear: straight-line motion (e.g. piston, actuator) Oscillating: back-and-forth motion (e.g. cam follower, lever)","background":"assets/slide-02.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":62.60602034120735,"y":30.496033829104697,"w":34.609375,"h":15.833333333333334,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"},{"src":"assets/ppt_media_image3.gif","x":66.9028871391076,"y":46.329367162438025,"w":26.015625,"h":42.916666666666664,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 6"}]},{"number":3,"title":"Mechanical Power Transmission","text":"Mechanical Power Transmission Why it matters in mechatronics: Converts motor output into useful motion for tasks Allows control of speed, torque, and direction Ensures efficient interaction between mechanical and electronic systems","background":"assets/slide-03.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":62.60602034120735,"y":30.496033829104697,"w":34.609375,"h":15.833333333333334,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 3"},{"src":"assets/ppt_media_image3.gif","x":66.9028871391076,"y":46.329367162438025,"w":26.015625,"h":42.916666666666664,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":4,"title":"Gears","text":"Gears What are gears? Gears are toothed wheels that mesh together to transmit rotary motion between shafts. They can change speed, torque, or direction of rotation depending on their size and arrangement. Why they’re important: Allow precise control of movement in mechatronic systems Enable speed reduction or increase to match motor output with load needs Provide mechanical advantage for lifting or driving heavier loads","background":"assets/slide-04.webp","animations":[{"src":"assets/ppt_media_image4.gif","x":62.690838254593174,"y":32.542534266550014,"w":41.918643372703414,"h":38.94940215806358,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":270,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":5,"title":"Gears","text":"Gears How they work: When two gears mesh, the driver gear turns the driven gear The gear ratio determines how much speed or torque is altered Where you’ll find them: Robotic joints, servo gearboxes, conveyor systems, CNC machinery  ","background":"assets/slide-05.webp","animations":[{"src":"assets/ppt_media_image4.gif","x":62.690838254593174,"y":32.542534266550014,"w":41.918643372703414,"h":38.94940215806358,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":270,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":6,"title":"Gear Size and Teeth","text":"Gear Size and Teeth Larger gears = more teeth This is because all teeth must be the same size for the gears to “mesh” (fit together) So, you need more teeth to fit the same circumference ","background":"assets/slide-06.webp","animations":[{"src":"assets/ppt_media_image4.gif","x":62.690838254593174,"y":32.542534266550014,"w":41.918643372703414,"h":38.94940215806358,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":270,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":7,"title":"Gear Ratio Effect on Speed/Torque","text":"Gear Ratio Effect on Speed/Torque If the ratio > 1: torque increases, speed decreases If the ratio \u003c 1: speed increases, torque decreases  ","background":"assets/slide-07.webp","animations":[{"src":"assets/ppt_media_image4.gif","x":68.52019356955381,"y":43.67350539515894,"w":33.69963090551181,"h":31.31256926217556,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":270,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":8,"title":"Spur Gears","text":"Spur Gears Definition: Spur gears are the simplest and most common type of gear. They have straight teeth cut parallel to the axis of rotation. Used to transmit motion and power between parallel shafts. Key features: Smooth and efficient for moderate speeds Easy to design and manufacture Produce axial thrust–free motion (no sideways forces on the shafts)","background":"assets/slide-08.webp","animations":[{"src":"assets/ppt_media_image5.gif","x":53.08458825459318,"y":22.22222222222222,"w":42.96875,"h":55.55555555555556,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":9,"title":"Spur Gears","text":"Spur Gears Advantages: High efficiency and reliability Simple to align and maintain Ideal for speed reduction or increase in small gear trains Limitations: Can be noisy at high speeds Only suitable for parallel shafts","background":"assets/slide-09.webp","animations":[{"src":"assets/ppt_media_image5.gif","x":53.08458825459318,"y":22.22222222222222,"w":42.96875,"h":55.55555555555556,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":10,"title":"Bevel Gears","text":"Bevel Gears Definition: Bevel gears are conical gears used to transmit motion between intersecting shafts, usually at right angles. The teeth are cut on a cone-shaped surface instead of a cylinder. Key features: Commonly used for 90° power transfer Available as straight, spiral, or hypoid bevel gears Allow smooth direction changes in compact systems","background":"assets/slide-10.webp","animations":[{"src":"assets/ppt_media_image6.gif","x":60.58188976377953,"y":18.27872557596967,"w":34.37339238845144,"h":61.10825313502479,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":11,"title":"Bevel Gears","text":"Bevel Gears Advantages: Efficient torque transfer at angled shafts Compact and reliable mechanical design Can increase or decrease speed and torque Limitations: More complex to manufacture than spur gears Require accurate alignment to avoid wear and noise","background":"assets/slide-11.webp","animations":[{"src":"assets/ppt_media_image6.gif","x":60.58188976377953,"y":18.27872557596967,"w":34.37339238845144,"h":61.10825313502479,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":12,"title":"Worm Gears","text":"Worm Gears Definition: A worm gear system consists of a screw-like worm that meshes with a toothed wheel (worm wheel). It’s used to achieve high torque reduction and large speed decreases in a compact space. Key features: Transmits motion between non-parallel, non-intersecting shafts (usually at 90°) Provides very high gear ratios in a single stage Motion is non-reversible — the worm can drive the wheel, but the wheel can’t drive the worm","background":"assets/slide-12.webp","animations":[{"src":"assets/ppt_media_image7.gif","x":58.21427985564304,"y":16.031729367162438,"w":37.85714402887139,"h":67.30158938466025,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":13,"title":"Worm Gears","text":"Worm Gears Advantages: Excellent for torque multiplication Compact and quiet operation Built-in self-locking feature (improves safety) Limitations: Lower efficiency due to friction and heat Requires good lubrication to prevent wear","background":"assets/slide-13.webp","animations":[{"src":"assets/ppt_media_image7.gif","x":58.21427985564304,"y":16.031729367162438,"w":37.85714402887139,"h":67.30158938466025,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":14,"title":"Planetary Gears","text":"Planetary Gears Definition: A planetary gear system (also called an epicyclic gear train) consists of a central sun gear, orbiting planet gears, and an outer ring gear. Used to achieve compact, high-torque transmission with multiple gear ratios in one assembly. Key features: Sun gear drives multiple planet gears that rotate around it Ring gear provides an outer stationary or driven surface Can produce very high torque density in a small size Different combinations (locking or driving various parts) give multiple speed ratios","background":"assets/slide-14.webp","animations":[{"src":"assets/ppt_media_image8.gif","x":60.63577755905512,"y":14.756211723534559,"w":35.625,"h":70,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":15,"title":"Planetary Gears","text":"Planetary Gears Advantages: Compact and efficient High torque output for its size Smooth and balanced operation Ideal for servo motors and robotic joints Limitations: More complex and expensive than simple gear pairs Difficult to repair or service individually","background":"assets/slide-15.webp","animations":[{"src":"assets/ppt_media_image8.gif","x":60.63577755905512,"y":14.756211723534559,"w":35.625,"h":70,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":16,"title":"Cams","text":"Cams Definition: A cam is a specially shaped rotating or sliding component used to convert rotary motion into reciprocating or oscillating motion. Works with a follower that moves according to the cam’s profile. Key features: Common cam shapes: pear, heart, circular, and eccentric The cam profile controls the rise, dwell, and return of the follower Often combined with a spring or gravity to keep the follower in contact","background":"assets/slide-16.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":70.80915354330709,"y":15.348629337999416,"w":23.297990485564306,"h":70.23162729658793,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":17,"title":"Parts of a Cam","text":"Parts of a Cam Cam -  The driving part that rotates or moves to create motion. Follower -  The driven part that moves in response to the cam’s surface. Spring or Gravity Return -  Keeps the follower in constant contact with the cam surface. Camshaft -  The shaft or spindle that the cam is fixed to. Frame or Support -  Holds the components in alignment and allows smooth motion.","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"Cams","text":"Cams Advantages: Provides precise control of follower movement Can generate complex motion patterns from simple rotation Reliable and compact mechanism Limitations: Generates friction and wear at contact points Usually limited to low or moderate speeds Difficult to adjust motion without changing cam shape","background":"assets/slide-18.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":70.80915354330709,"y":15.348629337999416,"w":23.297990485564306,"h":70.23162729658793,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":19,"title":"Cam profiles and motion types","text":"Cam profiles and motion types Cam profile basics: The shape of the cam determines how the follower moves. One full cam rotation produces a cycle made up of: Rise – follower moves upward/outward Dwell – follower stays still Return – follower moves downward/back Motion types produced: Uniform motion – constant speed of follower Accelerating and decelerating motion – smoother movement, reduces shock Intermittent motion – follower stops and starts during rotation","background":"assets/slide-19.webp","animations":[{"src":"assets/ppt_media_image9.gif","x":70.80915354330709,"y":15.348629337999416,"w":23.297990485564306,"h":70.23162729658793,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":20,"title":"Common Cam Profiles","text":"Common Cam Profiles Common cam profiles: Pear cam: smooth rise and fall with a long dwell – used for consistent timing Heart cam: ensures uniform motion and returns to start smoothly Eccentric cam: produces simple harmonic (smooth sinusoidal) motion Cylindrical cam: follower moves parallel to cam axis – used in automatic machinery Drop (Snail) cam: provides a gradual rise followed by a sudden drop, used where a quick return motion is needed","background":"assets/slide-20.webp","animations":[{"src":"assets/ppt_media_image11.gif","x":50.25,"y":33.75132691746865,"w":46.49524278215223,"h":44.991178186060075,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
