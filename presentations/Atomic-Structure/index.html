*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}
</style></head><body><header class="toolbar"><strong>⚙ Atomic Structure</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Atomic Structure","text":"Atomic Structure","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"What is an Atom","text":"What is an Atom An atom is the smallest unit of an element that still retains that element’s properties All substances are made from atoms Atoms are extremely small — millions could fit across the width of a human hair Atoms cannot be broken down by chemical reactions Breaking an atom apart requires nuclear processes, not chemistry","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Inside the Atom","text":"Inside the Atom An atom is made of two main regions: The nucleus at the centre Electrons moving around the nucleus The nucleus contains almost all the atom’s mass Electrons are very light and occupy most of the atom’s volume Most of an atom is empty space Even though atoms are tiny, they have a complex internal structure","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Nucleus","text":"Nucleus The nucleus is the dense centre of the atom It contains protons and neutrons The nucleus contains almost all of the atom’s mass It has an overall positive charge (due to protons) It is extremely small compared to the size of the atom","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Protons","text":"Protons A proton is a positively charged particle Located in the nucleus of the atom Charge: +1 Mass: ≈ 1 atomic mass unit (amu) Every atom of an element has the same number of protons","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Protons","text":"Protons The number of protons is called the atomic number The atomic number defines the element 1 proton → Hydrogen 6 protons → Carbon 8 protons → Oxygen","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Neutrons","text":"Neutrons A neutron is a particle with no electrical charge Located in the nucleus of the atom Charge: 0 Mass: ≈ 1 atomic mass unit (amu) Neutrons add mass but not charge","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Neutrons","text":"Neutrons Neutrons do not change the element Changing the number of neutrons changes the mass, not the identity","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Electrons","text":"Electrons An electron is a negatively charged particle Found outside the nucleus, moving around it Charge: –1 Mass: Very small (negligible compared to protons and neutrons) Electrons are held near the nucleus by electrical attraction","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Electrons","text":"Electrons Electrons control: Chemical reactions Bonding Electrical behaviour In a neutral atom: Number of electrons = number of protons","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Electron Shells & Clouds","text":"Electron Shells & Clouds Electron shells Electrons exist in regions called shells (or energy levels) Shells are found at different distances from the nucleus Inner shells fill before outer shells Electron clouds Electrons do not move in fixed circular paths Instead, they exist in areas of probability called electron clouds A cloud shows where an electron is likely to be found, not an exact path","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Electron Shells & Clouds","text":"Electron Shells & Clouds Shell diagrams are a simplified model They help us understand: Valence electrons Bonding Ions Shells = useful model Electron clouds = more accurate description","background":"assets/slide-12.webp","animations":[]},{"number":13,"title":"Valence & Valence Shell","text":"Valence & Valence Shell The valence shell is the outermost electron shell of an atom Valence electrons are the electrons in the valence shell These electrons are the most important for reactions They determine: How an atom bonds with other atoms How reactive an atom is Whether an atom will form an ion","background":"assets/slide-13.webp","animations":[]},{"number":14,"title":"Valence & Valence Shell","text":"Valence & Valence Shell Atoms with full valence shells are usually more stable Atoms with unfilled valence shells are more reactive","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"Ions","text":"Ions An ion is an atom that has gained or lost electrons Atoms gain or lose valence electrons to become more stable The nucleus (protons and neutrons) does not change Losing electrons → positive ion (cation) Gaining electrons → negative ion (anion)","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Ions","text":"Ions Protons never move during ion formation The atom is still the same element Sodium (Na) loses 1 electron → Na⁺ Chlorine (Cl) gains 1 electron → Cl⁻ More Electrons So Negative More Electrons So Negative","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Elements","text":"Elements An element is a pure substance made of only one type of atom All atoms of an element have the same number of protons This number is called the atomic number Examples: Hydrogen (H) Oxygen (O) Copper (Cu) Iron (Fe)","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"Elements","text":"Elements An element can exist as: Single atoms (e.g. He) Molecules made of the same element (e.g. O₂) Elements are the building blocks of all materials","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"Molecules","text":"Molecules A molecule is made when two or more atoms are chemically bonded together Atoms in a molecule share or transfer valence electrons Molecules behave as a single unit Examples: O₂ – oxygen molecule (same element) H₂O – water molecule (different elements) CO₂ – carbon dioxide molecule","background":"assets/slide-19.webp","animations":[]},{"number":20,"title":"Molecules","text":"Molecules Not all molecules are compounds A compound is a molecule made from different elements Most substances we interact with are molecular, not single atoms","background":"assets/slide-20.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
