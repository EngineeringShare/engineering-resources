<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172333">
  <title>AC Generation | Engineering Share</title>
  <style>
    :root { color-scheme: dark; --surface:#152235; --line:#39495d; --text:#ecf3fa; --muted:#9fb0c4; --accent:#df9b43; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { display:flex; flex-direction:column; overflow:hidden; background:#0c1420; color:var(--text); font:14px/1.4 system-ui,-apple-system,Segoe UI,Arial,sans-serif; }
    button,input,a { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:focus-visible,input:focus-visible,a:focus-visible,.slide:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .topbar { position:relative; z-index:5; min-height:54px; padding:8px clamp(12px,2vw,26px); display:flex; align-items:center; gap:16px; justify-content:space-between; border-bottom:1px solid #253246; background:#142135; }
    .identity { display:flex; align-items:center; gap:12px; min-width:0; }
    .logo { display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#df9b43,#a56727); color:#142030; font-size:22px; font-weight:900; flex:none; }
    .headings { min-width:0; }
    .headings strong { display:block; font-size:14px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .headings small { display:block; font-size:11px; color:var(--muted); letter-spacing:.035em; }
    .top-actions { display:flex; gap:8px; align-items:center; }
    .view-switch { display:inline-flex; align-items:center; padding:3px; border:1px solid #405268; border-radius:9px; background:#0d192a; gap:2px; }
    .view-option { border:0; border-radius:6px; padding:6px 10px; background:transparent; color:#b1c0d0; cursor:pointer; font-weight:600; white-space:nowrap; }
    .view-option[aria-pressed="true"] { background:#e8a54f; color:#162335; box-shadow:0 1px 4px #0005; }
    .view-option:hover:not([aria-pressed="true"]) { background:#263b55; color:#fff; }
    .pill,.control { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); border-radius:8px; padding:7px 12px; background:#1b2c42; text-decoration:none; color:var(--text); white-space:nowrap; }
    .pill:hover,.control:hover:not(:disabled) { background:#263b55; }
    .control:disabled { opacity:.4; cursor:default; }
    .overlay-indicator { width:10px; height:10px; border-radius:50%; background:transparent; border:1px solid #b4c3d3; }
    #overlay-button[data-active="true"] { border-color:#c18d4c; }
    .overlay-panel { position:absolute; right:clamp(12px,2vw,26px); top:calc(100% + 5px); width:min(342px,calc(100vw - 24px)); background:#19283d; color:#ecf3fa; padding:14px; border:1px solid #51647b; border-radius:12px; box-shadow:0 15px 40px #07101bc0; }
    .overlay-panel strong { display:block; font-size:14px; margin-bottom:3px; }
    .overlay-panel p { font-size:12px; color:#b6c5d4; margin:0 0 12px; }
    .overlay-choices { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
    .overlay-choice { display:flex; align-items:center; gap:7px; text-align:left; border:1px solid #3c5068; border-radius:8px; background:#20334a; color:#f1f6fb; min-height:40px; padding:7px; cursor:pointer; font-size:12px; }
    .overlay-choice:hover { background:#2c425c; }
    .overlay-choice[aria-pressed="true"] { border-color:#e9aa57; box-shadow:0 0 0 1px #e9aa57 inset; }
    .swatch { display:block; flex:none; width:19px; height:19px; background:var(--swatch); border:1px solid #a5b3c3; border-radius:50%; }
    .overlay-strength-row { display:flex; justify-content:space-between; align-items:center; margin:14px 0 4px; font-size:12px; color:#dce6f0; }
    .overlay-strength { width:100%; accent-color:#e9aa57; }
    .overlay-strength:disabled { opacity:.4; }
    .viewer { --overlay-tint:transparent; --overlay-strength:0; flex:1; min-height:0; min-width:0; position:relative; overflow:hidden; }
    .stage-wrap { height:100%; display:grid; place-items:center; padding:clamp(6px,1.5vh,16px); min-height:0; min-width:0; }
    .slide { position:relative; width:min(100%,calc((100dvh - 144px) * 16 / 9)); max-height:100%; aspect-ratio:16/9; overflow:hidden; border-radius:4px; background:#fff; box-shadow:0 12px 50px #0009; outline-offset:4px; }
    .slide img { display:block; user-select:none; -webkit-user-drag:none; }
    .slide-bg { width:100%; height:100%; object-fit:fill; }
    .animation { position:absolute; overflow:hidden; pointer-events:none; }
    .animation img { position:absolute; max-width:none; max-height:none; }
    .slide::after,.scroll-slide::after { content:""; position:absolute; inset:0; z-index:2; background:var(--overlay-tint); opacity:var(--overlay-strength); mix-blend-mode:multiply; pointer-events:none; }
    .scroll-wrap { height:100%; overflow-y:auto; overscroll-behavior:contain; background:#dce3ea; padding:14px clamp(12px,3vw,34px) 28px; scrollbar-gutter:stable; }
    .scroll-pages { width:min(100%,1180px); margin:0 auto; display:flex; flex-direction:column; gap:16px; }
    .scroll-page { margin:0; }
    .scroll-number { display:block; color:#45566b; font-size:12px; font-weight:650; margin:0 0 6px; font-variant-numeric:tabular-nums; }
    .scroll-slide { position:relative; width:100%; aspect-ratio:16/9; background:#fff; box-shadow:0 3px 15px #26374736; overflow:hidden; }
    .scroll-slide img { display:block; user-select:none; -webkit-user-drag:none; }
    [hidden] { display:none !important; }
    .controls { background:var(--surface); border-top:1px solid #26374d; padding:10px 16px; display:flex; gap:12px; align-items:center; justify-content:center; min-height:68px; }
    .nav-buttons { display:flex; gap:7px; }
    .counter { color:var(--muted); font-variant-numeric:tabular-nums; text-align:center; min-width:120px; font-weight:600; }
    .progress { flex:1; max-width:620px; min-width:60px; accent-color:var(--accent); cursor:pointer; }
    .hint { color:#97a6bb; text-align:right; font-size:11px; min-width:110px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:760px) {
      .topbar { flex-wrap:wrap; gap:6px; }
      .top-actions { width:100%; justify-content:flex-end; }
    }
    @media(max-width:600px) {
      .headings small,.hint,.download-label { display:none; }
      .topbar { min-height:46px; }
      .logo { display:none; }
      .view-option { padding:6px 7px; font-size:12px; }
      .pill { padding:7px 9px; font-size:12px; }
      .controls { min-height:56px; padding:7px 10px; gap:7px; }
      .control { padding:7px 9px; }
      .counter { min-width:84px; font-size:11px; }
      .slide { width:min(100%,calc((100dvh - 112px) * 16 / 9)); }
      .scroll-wrap { padding:8px 8px 20px; }
      .scroll-pages { gap:12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <div class="logo" aria-hidden="true">⚙</div>
      <div class="headings"><strong>AC Generation</strong><small>ENGINEERING SHARE · ANIMATED PRESENTATION</small></div>
    </div>
    <div class="top-actions">
      <div class="view-switch" role="group" aria-label="Presentation viewing mode">
        <button class="view-option" id="mode-scroll" type="button" aria-pressed="true">Scroll</button>
        <button class="view-option" id="mode-slides" type="button" aria-pressed="false">Presentation</button>
      </div>
      <button class="pill" id="overlay-button" type="button" aria-expanded="false" aria-controls="overlay-panel" data-active="false"><span class="overlay-indicator" id="overlay-indicator" aria-hidden="true"></span> Overlay</button>
      <a class="pill" href="AC-Generation.pdf" target="_blank" rel="noopener" title="Open original PDF">↓ <span class="download-label">PDF</span></a>
      <button class="pill" id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">⛶</button>
    </div>
    <section class="overlay-panel" id="overlay-panel" role="group" aria-label="Reading overlay settings" hidden>
      <strong>Reading overlay</strong>
      <p>Choose a colour to tint the slides, then adjust its strength.</p>
      <div class="overlay-choices" role="group" aria-label="Overlay colour">
        <button class="overlay-choice" type="button" data-color="none" aria-pressed="true"><span class="swatch" style="--swatch:#ffffff" aria-hidden="true"></span> None</button>
        <button class="overlay-choice" type="button" data-color="yellow" aria-pressed="false"><span class="swatch" style="--swatch:#ffe28a" aria-hidden="true"></span> Yellow</button>
        <button class="overlay-choice" type="button" data-color="blue" aria-pressed="false"><span class="swatch" style="--swatch:#b8dcff" aria-hidden="true"></span> Blue</button>
        <button class="overlay-choice" type="button" data-color="green" aria-pressed="false"><span class="swatch" style="--swatch:#bfe8c5" aria-hidden="true"></span> Green</button>
        <button class="overlay-choice" type="button" data-color="pink" aria-pressed="false"><span class="swatch" style="--swatch:#ffd1e5" aria-hidden="true"></span> Pink</button>
        <button class="overlay-choice" type="button" data-color="peach" aria-pressed="false"><span class="swatch" style="--swatch:#ffd2ae" aria-hidden="true"></span> Peach</button>
      </div>
      <div class="overlay-strength-row"><label for="overlay-strength">Strength</label><output id="overlay-strength-value" for="overlay-strength">25%</output></div>
      <input class="overlay-strength" id="overlay-strength" type="range" min="10" max="55" value="25" step="5" disabled aria-label="Overlay strength">
    </section>
  </header>
  <main id="viewer" class="viewer">
    <section class="stage-wrap" id="stage-wrap" aria-label="Slide-by-slide presentation" hidden>
      <div id="slide" class="slide" role="group" tabindex="0" aria-roledescription="slide" aria-label="Slide 1"></div>
    </section>
    <section class="scroll-wrap" id="scroll-wrap" aria-label="Continuous scrolling presentation" tabindex="0">
      <div class="scroll-pages" id="scroll-pages"></div>
    </section>
    <div id="slide-text" class="sr-only" aria-live="polite"></div>
  </main>
  <footer class="controls" aria-label="Presentation controls" hidden>
    <div class="nav-buttons">
      <button id="previous" class="control" type="button" aria-label="Previous slide" title="Previous slide (←)">←</button>
      <button id="next" class="control" type="button" aria-label="Next slide" title="Next slide (→)">→</button>
    </div>
    <span id="counter" class="counter" aria-live="off">1 / 14</span>
    <input id="progress" class="progress" type="range" min="1" max="14" step="1" value="1" aria-label="Jump to slide">
    <span class="hint">← → to navigate</span>
  </footer>
  <script>
    'use strict';
    const slides = [{"number":1,"title":"AC Generation","text":"AC Generation","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"What is an AC generator","text":"What is an AC generator An AC generator converts mechanical motion into oscillating single or 3 phase electrical energy AC generators are widely used because AC power is more efficient to transmit over long distances, as its voltage can be easily stepped up or down using transformers They are also widely used as they are simpler to build using slip rings instead of a commutator","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Faraday’s Law of Electromagnetic Induction","text":"Faraday’s Law of Electromagnetic Induction The induced EMF (voltage) in a circuit is proportional to the rate of change of magnetic flux through the circuit. This means that moving a magnet near a coil induces an EMF; if the coil is part of a closed circuit, this produces an electric current.","background":"assets/slide-03.webp","animations":[{"src":"assets/image3.gif","x":51.793848,"y":38.171522,"w":39.706152,"h":39.764975,"crop":{"l":0.0,"t":0.0,"r":0.0,"b":0.0},"rotation":0.0,"flipH":false,"flipV":false}]},{"number":4,"title":"Faraday’s Law of Electromagnetic Induction","text":"Faraday’s Law of Electromagnetic Induction Faraday’s law follows this equation: Where: = induced EMF (volts) = number of turns in the coil = magnetic flux (webers) = rate of change of flux","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Why AC Generators Produce Sinusoidal","text":"Why AC Generators Produce Sinusoidal As a coil rotates within a magnetic field, the magnetic flux passing through it continually changes. The amount of magnetic flux depends on the angle between the coil and the magnetic field. According to Faraday's Law, the induced EMF depends on the rate of change of magnetic flux. As the coil rotates at a constant speed, the induced EMF varies sinusoidally, producing an AC waveform. The induced EMF reverses polarity every half rotation.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Why AC Generators Produce Sinusoidal","text":"Why AC Generators Produce Sinusoidal The relationship between rotation and induced EMF can be explained by the equations: Where: B = magnetic flux density (T) A = coil area (m²) N = number of turns = angular velocity (rad/s) = angle of rotation (radians)","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Construction - Stator","text":"Construction - Stator Definition: The stationary part of an AC generator. Function: Holds the armature windings where AC is induced. Provides the path for magnetic flux. Features: Laminated steel core (reduces eddy current losses). Copper windings. Outer frame for support and cooling. Important Point: In most AC generators, the stator produces the electrical output, while the rotor carries the magnetic field.","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Construction - Rotor","text":"Construction - Rotor Definition: The rotating part of an AC generator. Function: Often produces the magnetic field (either by permanent magnets or an electromagnet). Rotates within the stator to induce AC voltage in the windings. Features: Shaft connected to the prime mover (e.g., turbine or engine). Field windings or permanent magnets mounted on the rotor core. Slip rings and brushes supply current to field windings (if electromagnet).","background":"assets/slide-08.webp","animations":[{"src":"assets/image9.gif","x":64.101985,"y":32.321624,"w":26.898023,"h":47.818708,"crop":{"l":0.0,"t":0.0,"r":0.0,"b":0.0},"rotation":0.0,"flipH":false,"flipV":false}]},{"number":9,"title":"Two Generator Setups","text":"Two Generator Setups Rotor Field Setup: Rotor carries the field windings (or magnets). Stator holds the armature windings where AC is induced. Most common in large power stations. Stator Field Setup: Stator carries the field windings. Rotor holds the armature windings where AC is induced. Used in some small machines. Key Difference: Where the AC is induced → either in the rotor coils or in the stator coils. Rotor Field Setup Stator Field Setup","background":"assets/slide-09.webp","animations":[{"src":"assets/image9.gif","x":77.400853,"y":50.0,"w":21.843135,"h":38.83224,"crop":{"l":0.0,"t":0.0,"r":0.0,"b":0.0},"rotation":0.0,"flipH":false,"flipV":false},{"src":"assets/image10.gif","x":71.81542,"y":8.586075,"w":25.230643,"h":29.080592,"crop":{"l":0.45326,"t":0.0,"r":0.0,"b":0.17592},"rotation":0.0,"flipH":false,"flipV":false}]},{"number":10,"title":"Slip Rings & Brushes","text":"Slip Rings & Brushes Definition: Slip rings: circular conductors on the rotor shaft. Brushes: carbon or graphite blocks pressing against slip rings. Function: Together, they transfer AC voltage from the rotating coil to the external circuit. Maintain continuous contact while the rotor spins. They are only needed in stator field setups. Features: Slip rings made of copper or brass. Brushes made of carbon/graphite (good conductor + self-lubricating). Designed for low friction and long service life.","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Single vs Poly Phase AC Generation","text":"Single vs Poly Phase AC Generation The number of phases you get from an AC generator is dependant on the number of winding groups you have. They most commonly are single or three phase 3 Phase has voltage separated by 120 degrees","background":"assets/slide-11.webp","animations":[]},{"number":12,"title":"Rotational to Electricity","text":"Rotational to Electricity AC power is generated when the magnet in the system is rotated Often this rotation happens due to a turbine spinning The turbine will be turned by many different sources including wind, water, gas and steam Steam is the most used as it can transfer thermal energy (from burning materials or nuclear fission) to the turbine.","background":"assets/slide-12.webp","animations":[{"src":"assets/image13.gif","x":61.066962,"y":34.527778,"w":27.96875,"h":40.277778,"crop":{"l":0.0,"t":0.0,"r":0.0,"b":0.0},"rotation":0.0,"flipH":false,"flipV":false}]},{"number":13,"title":"How an AC Generator Works (Step by Step)","text":"How an AC Generator Works (Step by Step) Magnetic Field Created The rotor (field) produces a magnetic field — either from permanent magnets or an electromagnet. Field lines pass through the stator windings. Coil Rotation Begins The rotor is turned by a prime mover such as a turbine or engine. As it spins, the magnetic flux through the stator coils continually changes. Electromagnetic Induction Occurs According to Faraday’s Law, a changing magnetic flux induces an EMF (voltage) in the coils. The direction of induced current alternates as the magnetic poles pass the windings. AC Voltage Generated The induced EMF follows a sinusoidal waveform, alternating between positive and negative values. Frequency depends on the rotational speed and number of magnetic poles. Current Delivered to Load Slip rings and brushes maintain contact between the rotating coil and external circuit. The alternating current flows out to supply electrical power.","background":"assets/slide-13.webp","animations":[{"src":"assets/image14.webp","x":71.517856,"y":45.207655,"w":24.730668,"h":29.037927,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0.0,"flipH":false,"flipV":false}]},{"number":14,"title":"Frequency of output","text":"Frequency of output The frequency (f) is how many cycles occur per second, measured in Hertz (Hz). Determined by the generator’s speed and number of poles:","background":"assets/slide-14.webp","animations":[]}];
    const slideEl = document.getElementById('slide');
    const textEl = document.getElementById('slide-text');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const fullscreen = document.getElementById('fullscreen');
    const stageWrap = document.getElementById('stage-wrap');
    const scrollWrap = document.getElementById('scroll-wrap');
    const scrollPages = document.getElementById('scroll-pages');
    const controls = document.querySelector('.controls');
    const slidesMode = document.getElementById('mode-slides');
    const scrollMode = document.getElementById('mode-scroll');
    const viewer = document.getElementById('viewer');
    const overlayButton = document.getElementById('overlay-button');
    const overlayPanel = document.getElementById('overlay-panel');
    const overlayIndicator = document.getElementById('overlay-indicator');
    const overlayChoices = Array.from(document.querySelectorAll('.overlay-choice'));
    const overlayStrength = document.getElementById('overlay-strength');
    const overlayStrengthValue = document.getElementById('overlay-strength-value');
    const tintColours = {
      none:null, yellow:'#ffe28a', blue:'#b8dcff', green:'#bfe8c5',
      pink:'#ffd1e5', peach:'#ffd2ae'
    };
    let current = 0;
    let mode = 'scroll';
    let scrollBuilt = false;
    let scrollSections = [];
    let scrollFrame = 0;
    let selectedTint = 'none';
    let strength = 25;

    function applyOverlay() {
      const colour = tintColours[selectedTint];
      viewer.style.setProperty('--overlay-tint', colour || 'transparent');
      viewer.style.setProperty('--overlay-strength', colour ? String(strength / 100) : '0');
      overlayIndicator.style.background = colour || 'transparent';
      overlayButton.dataset.active = String(Boolean(colour));
      overlayStrength.value = String(strength);
      overlayStrength.disabled = !colour;
      overlayStrengthValue.textContent = `${strength}%`;
      overlayChoices.forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.color === selectedTint));
      });
      try { localStorage.setItem('es-reading-overlay', JSON.stringify({colour:selectedTint, strength})); } catch (_) {}
    }

    function setOverlayPanel(open) {
      overlayPanel.hidden = !open;
      overlayButton.setAttribute('aria-expanded', String(open));
    }

    try {
      const saved = JSON.parse(localStorage.getItem('es-reading-overlay') || 'null');
      if (saved && Object.prototype.hasOwnProperty.call(tintColours, saved.colour)) {
        selectedTint = saved.colour;
        if (Number.isFinite(saved.strength)) strength = Math.max(10, Math.min(55, Math.round(saved.strength / 5) * 5));
      }
    } catch (_) {}

    function positionAnimation(item, lazy = false) {
      const box = document.createElement('div');
      box.className = 'animation';
      box.style.left = `${item.x}%`;
      box.style.top = `${item.y}%`;
      box.style.width = `${item.w}%`;
      box.style.height = `${item.h}%`;
      if (item.rotation) box.style.transform = `rotate(${item.rotation}deg)`;
      const img = document.createElement('img');
      img.src = item.src;
      img.loading = lazy ? 'lazy' : 'eager';
      img.alt = '';
      img.setAttribute('aria-hidden', 'true');
      // PowerPoint's source crop is a percentage of the *uncropped* image.
      const crop = item.crop || {};
      const left = crop.l || 0, top = crop.t || 0, right = crop.r || 0, bottom = crop.b || 0;
      const visWidth = Math.max(0.001, 1 - left - right);
      const visHeight = Math.max(0.001, 1 - top - bottom);
      img.style.width = `${100 / visWidth}%`;
      img.style.height = `${100 / visHeight}%`;
      img.style.left = `${-100 * left / visWidth}%`;
      img.style.top = `${-100 * top / visHeight}%`;
      if (item.flipH || item.flipV) img.style.transform = `scale(${item.flipH ? -1 : 1},${item.flipV ? -1 : 1})`;
      box.append(img);
      return box;
    }

    function addSlideMedia(element, data, lazy = false) {
      const background = document.createElement('img');
      background.className = 'slide-bg';
      background.src = data.background;
      background.alt = '';
      background.draggable = false;
      background.loading = lazy ? 'lazy' : 'eager';
      element.replaceChildren(background, ...(data.animations || []).map(item => positionAnimation(item, lazy)));
    }

    function renderSlide() {
      const data = slides[current];
      addSlideMedia(slideEl, data);
      slideEl.setAttribute('aria-label', `Slide ${current + 1}: ${data.title}`);
      textEl.textContent = `Slide ${current + 1} of ${slides.length}. ${data.text}`;
      counter.textContent = `${current + 1} / ${slides.length}`;
      progress.value = String(current + 1);
      previous.disabled = current === 0;
      next.disabled = current === slides.length - 1;
      if (current < slides.length - 1) {
        const preload = new Image();
        preload.src = slides[current + 1].background;
      }
    }

    function goToSlide(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      renderSlide();
    }

    function advance() {
      if (current < slides.length - 1) goToSlide(current + 1);
    }

    function rewind() {
      if (current > 0) goToSlide(current - 1);
    }

    function buildScrollPages() {
      if (scrollBuilt) return;
      scrollSections = slides.map((data, index) => {
        const figure = document.createElement('figure');
        figure.className = 'scroll-page';
        figure.setAttribute('aria-label', `Slide ${index + 1}: ${data.title}`);
        const label = document.createElement('figcaption');
        label.className = 'scroll-number';
        label.textContent = `Slide ${index + 1} of ${slides.length}`;
        const frame = document.createElement('div');
        frame.className = 'scroll-slide';
        addSlideMedia(frame, data, true);
        figure.append(label, frame);
        return figure;
      });
      scrollPages.replaceChildren(...scrollSections);
      scrollBuilt = true;
    }

    function updateCurrentFromScroll() {
      if (mode !== 'scroll' || !scrollSections.length) return;
      const midpoint = scrollWrap.getBoundingClientRect().top + scrollWrap.clientHeight * 0.45;
      let nearest = 0;
      let distance = Infinity;
      for (let index = 0; index < scrollSections.length; index++) {
        const rect = scrollSections[index].getBoundingClientRect();
        if (rect.top <= midpoint && rect.bottom >= midpoint) { nearest = index; break; }
        const gap = Math.min(Math.abs(rect.top - midpoint), Math.abs(rect.bottom - midpoint));
        if (gap < distance) { distance = gap; nearest = index; }
      }
      current = nearest;
    }

    function setMode(nextMode) {
      if (nextMode === mode) return;
      if (mode === 'scroll') updateCurrentFromScroll();
      mode = nextMode;
      const scrolling = mode === 'scroll';
      slidesMode.setAttribute('aria-pressed', String(!scrolling));
      scrollMode.setAttribute('aria-pressed', String(scrolling));
      stageWrap.hidden = scrolling;
      scrollWrap.hidden = !scrolling;
      controls.hidden = scrolling;
      if (scrolling) {
        buildScrollPages();
        // Align the continuous view with the slide students were reading.
        requestAnimationFrame(() => {
          const target = scrollSections[current];
          if (!target) return;
          scrollWrap.scrollTop += target.getBoundingClientRect().top - scrollWrap.getBoundingClientRect().top - 8;
        });
        slideEl.replaceChildren(); // Avoid keeping duplicate GIFs running out of view.
      } else {
        scrollPages.replaceChildren(); // Release hidden GIFs and reconstruct if Scroll is reopened.
        scrollSections = [];
        scrollBuilt = false;
        renderSlide();
      }
    }

    overlayButton.addEventListener('click', () => setOverlayPanel(overlayPanel.hidden));
    overlayChoices.forEach(button => {
      button.addEventListener('click', () => {
        selectedTint = button.dataset.color;
        applyOverlay();
      });
    });
    overlayStrength.addEventListener('input', event => {
      strength = Number(event.target.value);
      applyOverlay();
    });
    previous.addEventListener('click', rewind);
    next.addEventListener('click', advance);
    slideEl.addEventListener('click', () => { if (mode === 'slides') advance(); });
    slidesMode.addEventListener('click', () => setMode('slides'));
    scrollMode.addEventListener('click', () => setMode('scroll'));
    scrollWrap.addEventListener('scroll', () => {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(() => {
        scrollFrame = 0;
        updateCurrentFromScroll();
      });
    }, {passive:true});
    progress.addEventListener('input', event => goToSlide(Number(event.target.value) - 1));
    document.addEventListener('click', event => {
      if (!overlayPanel.hidden && !overlayPanel.contains(event.target) && !overlayButton.contains(event.target)) {
        setOverlayPanel(false);
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !overlayPanel.hidden) {
        setOverlayPanel(false);
        overlayButton.focus();
        return;
      }
      if (mode !== 'slides') return;
      if (event.target === progress || ['BUTTON', 'A'].includes(event.target.tagName)) return;
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault(); advance();
      } else if (['ArrowLeft', 'PageUp'].includes(event.key)) {
        event.preventDefault(); rewind();
      } else if (event.key === 'Home') {
        event.preventDefault(); goToSlide(0);
      } else if (event.key === 'End') {
        event.preventDefault(); goToSlide(slides.length - 1);
      }
    });
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (error) {
        console.warn('Fullscreen is unavailable in this browser or embed:', error);
      }
    });
    progress.max = String(slides.length);
    applyOverlay();
    buildScrollPages();
  </script>
</body>
</html>
