</style></head><body><header class="toolbar"><strong>⚙ Dimensional Analysis</strong><div class="tools"><button id="scroll-btn" aria-pressed="true">Scroll</button><button id="slide-btn" aria-pressed="false">Presentation</button><button id="overlay-btn" aria-expanded="false">◉ Overlay</button><a href="presentation.pdf" target="_blank" download>↓ PDF</a><button id="fullscreen" title="Enter fullscreen" aria-label="Toggle presentation fullscreen">⛶ Fullscreen</button></div></header><main class="viewer" id="viewer"><div id="scroll" class="scroll"><div class="pages" id="pages"></div></div><div id="stage" class="stage" hidden><div class="frame" id="single"></div></div><div id="overlay-panel" class="panel" hidden><b>Reading overlay</b><div class="palette" id="palette"></div><label>Strength <output id="amount">25%</output><input id="strength" type="range" min="10" max="55" value="25" step="5"></label></div></main><footer class="controls" id="controls" hidden><button id="prev">← Previous</button><span id="counter"></span><input type="range" id="jump" min="1" step="1"><button id="next">Next →</button></footer><script>
'use strict';const slides=[{"number":1,"title":"Dimensional Analysis","text":"Dimensional Analysis","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Why do we use dimensional analysis?","text":"Why do we use dimensional analysis? It allows us to convert between different units for international cooperation We can simplify equations We can understand the relationship between different variables in a system","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"SI Units/Fundamental Variables","text":"SI Units/Fundamental Variables Length [L]  – Measures distance or size (example: meters) Mass [M]  – Measures how much matter something has (example: kilograms) Time [T]  – Measures the passage of events (example: seconds) Electric Current [I]  – Measures the flow of electric charge (example: amperes) Temperature [ Θ ]  – Measures heat or thermal energy (example: Celsius) Amount of Matter [N]  – Measures quantity of particles (example: Moles) Luminous Intensity [J]  – Measures the brightness of a light (example: Candelas) ","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Dimensions","text":"Dimensions All variables can be understood in terms of fundamental variables We can break down even the most complex units into fundamental values For example: Velocity = Distance ÷ Time Distance = Length [L] Time = Time [T] Units of velocity = [L/T]","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Example of breaking down a complex variable ","text":"Example of breaking down a complex variable  We know that the variables effecting the period of a swinging pendulum are: T ∝ L * g Where: L  = Length of pendulum g  = Acceleration due to gravity T  = Time period","background":"assets/slide-05.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":6,"title":"Example of breaking down a complex variable ","text":"Example of breaking down a complex variable  L  = Length of pendulum g  = Acceleration due to gravity T  = Time period Length is already in its fundamental form [L] Time is already in its fundamental form [T] Acceleration is not in its fundamental form, so we must zoom in on it","background":"assets/slide-06.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":7,"title":"Example of breaking down a complex variable ","text":"Example of breaking down a complex variable  Acceleration is not in its fundamental form, so we must zoom in on it Acceleration =  Distance is a  length [L]  value Time is already in its fundamental form [T] So, acceleration = [ ]  ","background":"assets/slide-07.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":8,"title":"Example of breaking down a complex variable ","text":"Example of breaking down a complex variable  So, acceleration = [ ] T ∝ L * g [T] ∝ [L] * [ ] We can put it in an easier to read form by using the fact     ","background":"assets/slide-08.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":9,"title":"Example of finding an equation","text":"Example of finding an equation    \u003c- This is not the equation for the pendulum, it still needs work We need to make sure that the exponents are the same on each side as currently it is not true  We need to split it again into its components and assign it exponents     We can neaten up by combining our   terms      ","background":"assets/slide-09.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":10,"title":"Example of finding an equation","text":"Example of finding an equation     We need to look at our terms on either side We only have T on both sides, and L only on one side We can set them equal  ","background":"assets/slide-10.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":11,"title":"Example of finding an equation","text":"Example of finding an equation For T we can work out: Therefore, we know   ","background":"assets/slide-11.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":12,"title":"Example of finding an equation","text":"Example of finding an equation So   because   ","background":"assets/slide-12.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":13,"title":"Example of finding an equation","text":"Example of finding an equation We know  With experimentation we could then work out any missing constants, for this we are missing   ","background":"assets/slide-13.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":72.36784776902887,"y":22.801093613298338,"w":19.13215223097113,"h":33.44582968795567,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 2"}]},{"number":14,"title":"Dimensionless groups","text":"Dimensionless groups In certain scenarios groups of variables can be put together in a group that cancels out, one example is the Reynolds number: where: •\tp = fluid density [M/L^3] •\tv = velocity [L/T] •\tD = pipe diameter [L] •\t μ =  viscosity [M/LT] = As we can see they all cancel out to be [Value] 0  which equals 1 so its 1 * 1 * 1 which equals 1","background":"assets/slide-14.webp","animations":[]},{"number":15,"title":"What is a dimensionless group/number","text":"What is a dimensionless group/number Dimensionless groups are groups of fundamental variables that cancel each other out This means that there are the same amount of positive and negative exponentials for each variable This means they are always equal to 1 no matter what you do","background":"assets/slide-15.webp","animations":[]},{"number":16,"title":"Why Dimensionless Groups Are Important","text":"Why Dimensionless Groups Are Important Simplify complex problems → Collapse multiple variables into fewer dimensionless parameters Check similarity and scaling → Allows small-scale experiments (e.g., wind tunnels, water tanks) to represent full-scale systems Universal results → Dimensionless numbers (e.g., Reynolds, Mach, Froude) apply across different systems and units Highlight dominant effects → Show whether inertia, viscosity, gravity, or other forces control the system behaviour Enable comparison → Engineers worldwide can compare results without worrying about unit systems","background":"assets/slide-16.webp","animations":[]},{"number":17,"title":"Example of a dimensionless group","text":"Example of a dimensionless group The Reynolds number is one of the most widely used dimensionless groups, particularly in the study of fluid dynamics. It is represented by [Re] It has the variables: p = fluid density [M/L^3] v = velocity [L/T] D = pipe diameter [L] μ =  viscosity [M/LT]","background":"assets/slide-17.webp","animations":[]},{"number":18,"title":"Proving Reynolds Number","text":"Proving Reynolds Number We can put our dimensions into the equation to get our dimensional format We then use the negative exponent rule to bring terms onto either side of the divide We then do that again to get all the terms onto one line = = =","background":"assets/slide-18.webp","animations":[]},{"number":19,"title":"Proving Reynolds Number","text":"Proving Reynolds Number Finally, we collect like-terms, and we should see all variables are to the power of 0 Therefore as 1*1*1 = 1 it must be dimensionless =      ","background":"assets/slide-19.webp","animations":[]},{"number":20,"title":"Buckingham ","text":"Buckingham  π  Theorem We wont always have easily found dimensionless groups So sometimes we have to find our own groups We can find out how many dimensionless groups an equation has using the Buckingham  π  Theorem k = n - r n = total number of variables r =  the number of fundamental variables","background":"assets/slide-20.webp","animations":[]},{"number":21,"title":"An example of working out dimensionless groups","text":"An example of working out dimensionless groups Let’s use the Buckingham π theorem to analyse the drag force (𝐹 𝑑 ​ ) acting on a sphere moving through a fluid. The drag force ( F d ) depends on: Fluid velocity (V) Fluid density ( ρ) Fluid viscosity ( μ) Sphere diameter (D) We aim to find the dimensionless groups ( π  terms) that describe the relationship. Step 1:  List the Variables and Their Dimensions F d   : Drag force [M*L/T 2 ] V : Velocity [L/T] ρ  : Density [M/L 3 ] μ  : Viscosity [M/L*T] D : Diameter [L] Step 2 : Count Variables and Fundamental Dimensions and apply the theorem Variables: 5 ( F d , V,  ρ ,  μ , D) Fundamentals: 3 (M, L, T) k = n – r K = 5 – 3 K = 2","background":"assets/slide-21.webp","animations":[]},{"number":22,"title":"An example of working out dimensionless groups (Continued)","text":"An example of working out dimensionless groups (Continued) Step 3 : Find repeating variables Note learning repeating variables takes time, you learn what variables are common in a subject area Common in fluid dynamics are  ρ , V and D First dimensionless group often contains the  dependent variable (the variable which we are studying, in this case it is  𝐹 𝑑 ​ ) Group 1: 𝐹 𝑑 ​,  ρ , V and D Group 2:  μ ,  ρ , V and D Step 4 : Work out the first dimensionless group Group 1: 𝐹 𝑑 ​ *  ρ  * V * D Group 1: [M*L/T 2 ] * [M/L 3 ] a  * [L/T] b  * [L] c Group 1: M   * L    * T -2  * M a  * L -3a  * L b  * T -b *  L c For M: 1 + a = 0 -> a = -1 For L: 1-3a+b+c = 0 For T: -2-b = 0 -> b = -2 Put a and b into L to get c: 1+3-2+c = 0 c = -2 Group 1: 𝐹 𝑑 ​ *  ρ a  *  V b   * D c Group 1: 𝐹 𝑑 ​ *  ρ -1  * V -2  * D -2","background":"assets/slide-22.webp","animations":[]},{"number":23,"title":"An example of working out dimensionless groups (Continued)","text":"An example of working out dimensionless groups (Continued) Step 5 : Work out the second dimensionless group Group 2:  μ  *  ρ  * V * D Group 2: [M/L*T] * [M/L 3 ] a  * [L/T] b  * [L] c Group 2: M   * L -1   * T -1  * M a  * L -3a  * L b  * T -b *  L c For M: 1 + a = 0 -> a = -1 For L: -1-3a+b+c = 0 For T: -1-b = 0 -> b = -1 Put a and b into L to get c: -1+3-1+c = 0 c = -1 Group 2:  μ ​ *  ρ a  *  V b   * D c Group 2:  μ  *  ρ -1  * V -1  * D -1 Step 6 : Check each group is dimensionless by writing it out Step 7 : Write out the relationship","background":"assets/slide-23.webp","animations":[]},{"number":24,"title":"Understanding dimensionless groups(Continued)","text":"Understanding dimensionless groups(Continued) Step 8 : Analyse the dimensionless groups we get (this step isn’t necessary but is good to help understand) Area This is the inverse Reynolds number (1/Re)","background":"assets/slide-24.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
