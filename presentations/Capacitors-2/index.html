'use strict';const slides=[{"number":1,"title":"Capacitors #2","text":"Capacitors #2","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"How a Capacitor Works - Charging","text":"How a Capacitor Works - Charging When a capacitor is put within a circuit with a source it builds up charge on one plate The charge on the first plate repels electrons on the other creating potential difference Once the first plate is fully charged (the capacitor is the same voltage as the battery) the current stops flowing (in DC) The dielectric stops the electrons from flowing from one plate to the other","background":"assets/slide-02.webp","animations":[{"src":"assets/ppt_media_image2.gif","x":66.0208251312336,"y":30.25925925925926,"w":24.979174868766403,"h":44.40742198891805,"crop":{"l":0,"t":0,"r":0,"b":0},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":3,"title":"How a Capacitor Works - Discharging","text":"How a Capacitor Works - Discharging When the circuit path changes, either by a switch or another component the capacitor releases its stored energy This is because there is a build up of charge on one side of the capacitor (stored energy) The capacitor must be connected to a resistor through a complete circuit to discharge","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Charging Curve – Charge","text":"Charging Curve – Charge The charging and discharging of capacitors follows exponential curves As we charge the capacitor it gets harder to push electrons onto cathode plate Initially it is very easy to push electrons onto the cathode plate, so we have a high rate of change As more electrons fill the plate it becomes crowded so our rate of change decreases until it approaches 0","background":"assets/slide-04.webp","animations":[{"src":"assets/ppt_media_image5.gif","x":67.74725229658793,"y":35.27233887430738,"w":23.752747703412073,"h":29.4553076698746,"crop":{"l":0,"t":0,"r":0.51454,"b":0.11313},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 4"}]},{"number":5,"title":"Charging Curve – Current","text":"Charging Curve – Current Our current is linked to our rate of change of our charge As our charge initially has a high rate of change during charging our current will be very high As the rate of change drops off our current also drops off towards 0","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Charging Curve – Potential Difference","text":"Charging Curve – Potential Difference Our potential difference increases as our charge in our capacitor increases. The graphs follow a similar curve with their rates of change being proportional We can see that the potential difference levels out at a max, this maximum will be the voltage from the power source","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Discharging Curve – Charge","text":"Discharging Curve – Charge If we take our charged capacitor and connect it to a resistor it discharges Initially it loses charge quickly as there is a high potential difference between the plates – this results in a high rate of change However, as the difference decreases our rate of change also decreases Charge: Potential Difference:","background":"assets/slide-07.webp","animations":[{"src":"assets/ppt_media_image5.gif","x":69.47802657480315,"y":10.605686789151356,"w":23.752739501312337,"h":29.455293088363955,"crop":{"l":0.48037,"t":0.00339,"r":0.03417,"b":0.10974},"rotation":0,"flipH":false,"flipV":false,"title":"Picture 6"}]},{"number":8,"title":"Discharging Curve – Current","text":"Discharging Curve – Current As our charge is initially leaving the capacitor very fast we have a high current initially This current decreases as the rate of change of charge decreases The graph ends up approaching 0 current as there is no potential difference It's important to note the current flows in the opposite way to the charging","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Time constant","text":"Time constant The Y-intercept of any of our curves we have just identified is the original value for voltage, current or charge When we are looking at our exponential curves, we need to consider the time constant  The time constant is the time it takes for the charge, current or voltage to reach    of its original value So, the time constant is the time it takes to get to 37% of the original value  ","background":"assets/slide-09.webp","animations":[]},{"number":10,"title":"Time constant","text":"Time constant We can calculate the time constant using Where R is the resistance, the capacitor is connected to And C is the capacitance of the capacitor  ","background":"assets/slide-10.webp","animations":[]},{"number":11,"title":"Half Life","text":"Half Life We can also work out a half-life for a capacitor This half life is the time it takes for the capacitor to reach 50% of its original value The half life can be indicated by  To equate the two, we do: And as   ","background":"assets/slide-11.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
