*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:#111e2e;color:#e9f2fa;font:14px system-ui,Segoe UI,sans-serif}button,a{font:inherit;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#182a3e;padding:9px 16px;border-bottom:1px solid #344b61}.toolbar strong{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #526b83;background:#233a54;color:#edf5fd;padding:8px 10px;border-radius:8px;text-decoration:none}button[aria-pressed=true]{background:#dca45a;color:#142132;border-color:#dca45a}button:hover,a:hover{filter:brightness(1.18)}.viewer{flex:1;min-height:0;position:relative;--tint:transparent;--strength:0}.scroll{height:100%;overflow:auto;background:#dfe6ed;padding:14px}.pages{max-width:1150px;margin:auto}.page{margin:0 0 18px}.page figcaption{color:#44566b;font-size:12px;margin-bottom:5px}.frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;box-shadow:0 4px 15px #25374733}.frame>img{width:100%;height:100%;display:block}.animation{position:absolute;overflow:hidden;pointer-events:none}.animation img{position:absolute;max-width:none;max-height:none}.frame:after{content:"";position:absolute;inset:0;background:var(--tint);opacity:var(--strength);mix-blend-mode:multiply;pointer-events:none}.stage{height:100%;display:grid;place-items:center;padding:10px}.stage .frame{width:min(100%,calc((100dvh - 155px)*16/9));max-height:100%}.controls{display:flex;justify-content:center;align-items:center;gap:15px;background:#182a3e;padding:12px}.controls input{width:min(35vw,360px)}.panel{position:absolute;right:12px;top:12px;z-index:10;padding:15px;background:#1d3046;border:1px solid #60758d;border-radius:12px;box-shadow:0 10px 30px #0008;max-width:calc(100vw - 24px)}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.palette button{display:flex;align-items:center;gap:6px;font-size:12px}.swatch{width:15px;height:15px;border-radius:50%;background:var(--color);border:1px solid #fff8}input[type=range]{accent-color:#dca45a}[hidden]{display:none!important}@media(max-width:600px){.toolbar strong{max-width:100%;font-size:12px}.toolbar{padding:8px}.tools{gap:4px}.tools button,.tools a{padding:6px;font-size:12px}.scroll{padding:7px}.page{margin-bottom:12px}}

'use strict';const slides=[{"number":1,"title":"DC Motor Speed Control","text":"DC Motor Speed Control","background":"assets/slide-01.webp","animations":[]},{"number":2,"title":"Methods for controlling DC Motor Speed","text":"Methods for controlling DC Motor Speed There are 3 main methods for controlling the speed of a dc motor: Armature Resistance Control Field Flux Control (Field Weakening) Armature Voltage Control","background":"assets/slide-02.webp","animations":[]},{"number":3,"title":"Armature Resistance Control","text":"Armature Resistance Control Speed of a DC motor is directly proportional to back emf (E₆) Back emf equation: E₆ = V – IₐRₐ (where V = supply voltage, Iₐ = armature current, Rₐ = armature resistance). If V and Rₐ are constant, speed is directly proportional to Iₐ. Increasing resistance in series with the armature reduces Iₐ. Reduced Iₐ leads to decreased speed.","background":"assets/slide-03.webp","animations":[]},{"number":4,"title":"Advantages of Armature Resistance Control","text":"Advantages of Armature Resistance Control Constant field current and torque:  With the armature control method, the field current and torque levels remain constant throughout the application. Regardless of the speed of the motor, you can rely on these factors. Fast and simple speed variation:  Armature controlled DC motors are known for their exceptional speed control, which allows operators to vary the speed as necessary in both directions.","background":"assets/slide-04.webp","animations":[]},{"number":5,"title":"Disadvantages of Armature Resistance Control","text":"Disadvantages of Armature Resistance Control Higher initial costs:  The armature control method is often more expensive than the field control method. Low energy efficiency:  Armature control is most used for shorter lengths of time one reason is that speed variation tends to waste large amounts of power. This power loss makes the process less energy efficient and more costly overall.","background":"assets/slide-05.webp","animations":[]},{"number":6,"title":"Field Flux Control","text":"Field Flux Control Speed is controlled by varying the current in the field winding, thus changing the magnetic flux. Effective for speeds above the rated speed. Reducing field strength increases speed but reduces torque.","background":"assets/slide-06.webp","animations":[]},{"number":7,"title":"Advantages of Field Control","text":"Advantages of Field Control Lower costs:  The field control method is a highly economical form of motor control. It’s easy to use and manage, and the lower operational costs make it cost-effective in the long-term. For manufacturers or engineers on a tight budget, this is an ideal solution. Minimal power loss:  The speed of a field-controlled DC motor is varied through the magnetic field rather than the armature. As a result, this method typically wastes a smaller amount of power. Extra energy efficiency can save both time and money while helping the environment.","background":"assets/slide-07.webp","animations":[]},{"number":8,"title":"Disadvantages of Field Control","text":"Disadvantages of Field Control Limits on speed:  If your application requires you to adjust the motor below the normal speed, you may be better off choosing an armature-controlled method. Field controlled DC motors can only operate above the normal speed. Higher speeds can also result in less torque. Reduced stability : The field control method allows operators to obtain higher speeds than the norm. Yet its overall range can be lowered due to a lack of stability. With a weaker field, you may only be able to safely exceed certain speeds.","background":"assets/slide-08.webp","animations":[]},{"number":9,"title":"Armature Voltage Control","text":"Armature Voltage Control Speed is controlled by varying the voltage applied to the armature while keeping the field current constant. This is often done by using two different voltage sources, 1 for the stator and 1 for the rotor Effective for speeds below the rated speed. Common in industrial applications using thyristor-based or PWM converters.","background":"assets/slide-09.webp","animations":[]}],$=id=>document.getElementById(id);let current=0,mode='scroll',tint='none',strength=25;const colors={none:null,yellow:'#ffe28a',blue:'#b8dcff',green:'#bfe8c5',pink:'#ffd1e5',peach:'#ffd2ae'};try{const v=JSON.parse(localStorage.getItem('es-reading-overlay')||'null');if(v&&v.colour in colors){tint=v.colour;strength=Math.max(10,Math.min(55,Number(v.strength)||25))}}catch(e){}function media(container,data){const bg=new Image();bg.src=data.background;bg.alt='';bg.loading='lazy';container.append(bg);for(const a of data.animations||[]){const box=document.createElement('div');box.className='animation';Object.assign(box.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%',transform:a.rotation?`rotate(${a.rotation}deg)`:'none'});const img=new Image();img.src=a.src;img.alt='';img.loading='lazy';const c=a.crop||{},l=c.l||0,t=c.t||0,r=c.r||0,b=c.b||0,vw=Math.max(.001,1-l-r),vh=Math.max(.001,1-t-b);Object.assign(img.style,{width:100/vw+'%',height:100/vh+'%',left:-100*l/vw+'%',top:-100*t/vh+'%',transform:`scale(${a.flipH?-1:1},${a.flipV?-1:1})`});box.append(img);container.append(box)}}function build(){const parent=$('pages');parent.replaceChildren();slides.forEach((s,i)=>{const f=document.createElement('figure');f.className='page';f.dataset.index=i;const cap=document.createElement('figcaption');cap.textContent=`Slide ${i+1} of ${slides.length}`;const frame=document.createElement('div');frame.className='frame';media(frame,s);f.append(cap,frame);parent.append(f)})}function render(){const el=$('single');el.replaceChildren();media(el,slides[current]);$('counter').textContent=`${current+1} / ${slides.length}`;$('jump').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1}function change(next){if(next===mode)return;if(mode==='scroll'){const figures=[...$('pages').children],top=$('scroll').getBoundingClientRect().top+90;let best=Infinity;figures.forEach((f,i)=>{const d=Math.abs(f.getBoundingClientRect().top-top);if(d<best){best=d;current=i}})}mode=next;$('scroll').hidden=next!=='scroll';$('stage').hidden=next!=='slides';$('controls').hidden=next!=='slides';$('scroll-btn').setAttribute('aria-pressed',next==='scroll');$('slide-btn').setAttribute('aria-pressed',next==='slides');if(next==='slides'){render();$('pages').replaceChildren()}else{build();requestAnimationFrame(()=>{const f=$('pages').children[current];if(f)$('scroll').scrollTop=f.offsetTop-$('pages').offsetTop});$('single').replaceChildren()}}function go(i){current=Math.max(0,Math.min(slides.length-1,i));render()}$('scroll-btn').onclick=()=>change('scroll');$('slide-btn').onclick=()=>change('slides');$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('jump').oninput=e=>go(Number(e.target.value)-1);$('single').onclick=()=>go(current+1);$('jump').max=slides.length;document.addEventListener('keydown',e=>{if(mode!=='slides'||['INPUT','BUTTON'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});$('overlay-btn').onclick=()=>{$('overlay-panel').hidden=!$('overlay-panel').hidden;$('overlay-btn').setAttribute('aria-expanded',!$('overlay-panel').hidden)};for(const [name,color]of Object.entries(colors)){const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="--color:${color||'#fff'}"></span>${name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{tint=name;apply()};b.dataset.name=name;$('palette').append(b)}function apply(){$('viewer').style.setProperty('--tint',colors[tint]||'transparent');$('viewer').style.setProperty('--strength',colors[tint]?strength/100:0);$('strength').value=strength;$('strength').disabled=tint==='none';$('amount').textContent=strength+'%';for(const b of $('palette').children)b.setAttribute('aria-pressed',b.dataset.name===tint);try{localStorage.setItem('es-reading-overlay',JSON.stringify({colour:tint,strength}))}catch(e){}}$('strength').oninput=e=>{strength=Number(e.target.value);apply()};document.addEventListener('click',e=>{if(!$('overlay-panel').hidden&&!$('overlay-panel').contains(e.target)&&!$('overlay-btn').contains(e.target))$('overlay-panel').hidden=true});apply();build();
</script></body></html>
